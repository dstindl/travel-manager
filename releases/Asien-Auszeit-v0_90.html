function gDown(x,y,tg){if(tg.closest('#map,.car,input,select,textarea,.leaflet-container'))return;G.sx=G.x=x;G.sy=G.y=y;G.mode=null;

function dragStart(d){G.mode='drag';G.el=d;navigator.vibrate&&navigator.vibrate(12);const r=d.getBoundingClientRect();G.off=G.y-r.top;

function gMove(x,y,ev){G.x=x;G.y=y;const dx=x-G.sx,dy=y-G.sy;
 if(!G.mode&&G.tm&&Math.hypot(dx,dy)>8){clearTimeout(G.tm);G.tm=null}
 if(G.mode==='drag'){ev&&ev.cancelable&&ev.preventDefault();G.el.style.top=(y-G.off)+'px';
  if(G.el.dataset.drag==='stage'){const sibs=[...document.querySelectorAll('[data-drag=stage]')].filter(e=>e!==G.el);let before=null;for(const e of sibs){const r=e.getBoundingClientRect();if(y<r.top+r.height/2){before=e;break}}
   if(before)before.parentNode.insertBefore(G.ph,before);else{const last=sibs[sibs.length-1];last&&last.parentNode.insertBefore(G.ph,last.nextSibling)}}
  else{document.querySelectorAll('.dropon').forEach(e=>e.classList.remove('dropon'));const z=document.elementFromPoint(x,y)?.closest('[data-day]');if(z)z.classList.add('dropon')}
  const sc=G.el.dataset.drag==='ex'?$('#sheet'):document.scrollingElement;if(y<90)sc.scrollTop-=12;else if(y>innerHeight-120)sc.scrollTop+=12;return}
 if(G.mode==='swpending'&&Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3)G.mode='swipe';
 if(G.mode==='swipe'){ev&&ev.cancelable&&ev.preventDefault();const k=G.el.dataset.swipe;const lim=k==='exp'?Math.min(0,dx):dx;G.fg.style.transition='none';G.fg.style.transform=`translateX(${lim}px)`}
 if(G.mode==='edge'&&dx>0){ev&&ev.cancelable&&ev.preventDefault();$('#main').style.transform=`translateX(${Math.min(dx,120)}px)`;$('#main').style.opacity=1-Math.min(dx,120)/400}}
function openSwipe(key){const x=openList().find(o=>o.key===key);if(!x)return;
 if(x.k==='chk'){S.chk=S.chk||{};S.chk[x.id]=true;save();render();UI.undo=()=>{delete S.chk[x.id];save();render()};toast(`Erledigt. <button class="tb" data-a="undo">Rückgängig</button>`,5000);return}
 const o=x.k==='stay'?(S.stages[x.i].stay=S.stages[x.i].stay||{}):legsOf(S.stages[x.i])[x.j];const prev=o.status;o.status='gebucht';if(o.paid===undefined)o.paid=true;save();render();
 UI.undo=()=>{if(prev==null)delete o.status;else o.status=prev;if(x.k==='stay'&&!Object.keys(o).filter(k=>k!=='status'&&k!=='paid').length)delete S.stages[x.i].stay;save();render()};
 toast(`Als gebucht markiert. <button class="tb" data-a="${x.k==='stay'?'stay':'leg'}" data-k="${x.i}" ${x.k==='tr'?`data-j="${x.j}"`:''}>Details</button><button class="tb" data-a="undo">Rückgängig</button>`,7000)}
function gUp(){clearTimeout(G.tm);G.tm=null;const dx=G.x-G.sx;
 if(G.mode==='drag'){G.suppress=true;setTimeout(()=>G.suppress=false,120);const d=G.el;d.classList.remove('dragging');d.style.left=d.style.top=d.style.width='';document.body.style.userSelect='';
  if(d.dataset.drag==='stage'){const order=[...document.querySelectorAll('[data-drag=stage],.ph')].map(e=>e===G.ph?'PH':+e.dataset.k).filter(v=>v!==+d.dataset.k);const pos=order.indexOf('PH');const after=order[pos-1],before=order[pos+1];
   const i=+d.dataset.k;let j;if(before!=null&&before!=='PH'){j=before>i?before-1:before}else if(after!=null){const a=after>i?after-1:after;j=a+1}else j=i;G.ph.remove();if(j!==i)moveStage(i,j);render()}
  else{G.ph.remove();const z=document.querySelector('.dropon');document.querySelectorAll('.dropon').forEach(e=>e.classList.remove('dropon'));const p=byId(d.dataset.id);
   if(z&&p&&(z.dataset.day||null)!==(p.planned||null)){const prev=p.planned;p.planned=z.dataset.day||null;save();render();UI.undo=()=>{p.planned=prev;save();render();if(UI.sheetCtx)stepSheet(UI.sheetCtx.i,'ausfluege')};toast(`${esc(p.name)} → ${p.planned?dl(pd(p.planned)):'ohne Tag'} <button class="tb" data-a="undo">Rückgängig</button>`,5000)}
   if(UI.sheetCtx)stepSheet(UI.sheetCtx.i,'ausfluege')}
  G.mode=null;return}
 if(G.mode==='swipe'){G.suppress=true;setTimeout(()=>G.suppress=false,120);const k=G.el.dataset.swipe,key=G.el.dataset.key;G.fg.style.transition='';
  if(k==='open'&&Math.abs(dx)>90){G.fg.style.transform=`translateX(${dx>0?'110%':'-110%'})`;setTimeout(()=>{if(dx>0)openSwipe(key);else{UI.later=UI.later.filter(x=>x!==key).concat([key]);saveLater();render();toast('Nach hinten verschoben.')}},180)}
  else if(k==='exp'&&dx<-90){G.fg.style.transform='translateX(-110%)';setTimeout(()=>expDelete(+key),180)}

function mapDetail(M,ds,sel){const css=getComputedStyle(document.body);const ink=css.getPropertyValue('--ink2').trim()||'#5F6368',warn=css.getPropertyValue('--warn').trim()||'#C68A1E',ok=css.getPropertyValue('--ok').trim()||'#3E8E5A',card=css.getPropertyValue('--card').trim()||'#fff';
 const inSel=c=>!UI.rc||UI.rc==='all'||c===UI.rc;const pts=[];
 ds.forEach(d=>{const st=S.stages[d.i];const LG=legsOf(st);if(!LG.length)return;const pv=d.i>0?S.stages[d.i-1]:null;const pp=pv?byId(pv.placeId):null;const p=byId(st.placeId);if(!p)return;
  if(!inSel(st.country)&&!(pv&&inSel(pv.country)))return;
  const A=pv&&pv.stay?.ll?[pv.stay.ll.lat,pv.stay.ll.lon]:pp?[pp.lat,pp.lon]:null;const B=st.stay?.ll?[st.stay.ll.lat,st.stay.ll.lon]:[p.lat,p.lon];if(!A)return;
  let cur=A;LG.forEach((l,j)=>{const f=l.fromLL?[l.fromLL.lat,l.fromLL.lon]:cur;let t=l.toLL?[l.toLL.lat,l.toLL.lon]:j===LG.length-1?B:(LG[j+1].fromLL?[LG[j+1].fromLL.lat,LG[j+1].fromLL.lon]:legGuess(LG,j,pp,p,pv?.country,st.country,f,B));if(!t)t=B;
   const bk=l.status==='gebucht';const fl=l.mode==='flight';const pl=L.polyline([f,t],{color:bk?ink:warn,weight:fl?1.4:2.6,opacity:fl?.5:.9,dashArray:bk?null:'6 6'}).addTo(M);if(pl.on)pl.on('click',()=>legSheet(d.i,j));cur=t})});
 ds.forEach(d=>{const st=S.stages[d.i];if(!inSel(st.country))return;const h=st.stay;
  if(h&&h.ll&&d.nights){const bk=h.status==='gebucht';const m=L.marker([h.ll.lat,h.ll.lon],{icon:L.divIcon({className:'',html:`<div class="hpin" style="border-color:${bk?ok:warn};background:${card}">${ic('bed',12,2.2)}</div>`,iconSize:[22,22],iconAnchor:[11,11]}),zIndexOffset:400}).addTo(M);if(m.on)m.on('click',()=>staySheet(d.i));pts.push([h.ll.lat,h.ll.lon])}
  exOf(d.i).forEach(x=>{if(x.lat==null)return;const m=L.circleMarker([x.lat,x.lon],{radius:4.5,color:ink,weight:1.5,fillColor:card,fillOpacity:1}).addTo(M);if(m.on)m.on('click',()=>placeSheet(x.id))})});
 return pts}

// ---------- Teilen aus anderen Apps (Buchung, Ort aus Google Maps) ----------
async function shareIn(){const q=new URLSearchParams(location.search);const sh=[q.get('title'),q.get('text'),q.get('url')].filter(Boolean).join('\n').trim();
 if(q.get('shared')){history.replaceState(history.state,'',location.pathname);try{const c=await caches.open('auszeit-share');const m=await c.match('./share-meta');if(!m)return;const meta=await m.json();await c.delete('./share-meta');const files=[];
   for(const f of meta.files||[]){const r=await c.match(f.key);if(r){const bl=await r.blob();files.push(new File([bl],f.name||'datei',{type:f.type||bl.type}))}await c.delete(f.key)}
   if(files.length){UI.bkPre=null;return bkRun({files})}const tx=[meta.title,meta.text,meta.url].filter(Boolean).join('\n').trim();if(tx)shareText(tx)}catch(e){}}
 else if(sh){history.replaceState(history.state,'',location.pathname);shareText(sh)}}
function shareText(tx){if(bkLooks(tx)){UI.bkPre=null;return bkRun({text:tx,name:'Geteilter Text'})}sharePlace(tx)}
async function sharePlace(raw){const tx=gmText(raw);const nm=tx.name||'';const q=[nm,tx.addr].filter(Boolean).join(', ');const R=UI.res={q:nm||'Geteilter Ort',load:true,share:raw};shareSheet();
 const jobs=[];if(gplKey()&&nm)jobs.push((async()=>{let r=[];try{r=await gplFind(q,null,{now:true,strict:true})}catch(e){}if(!r.length){try{r=await gplFind(q,null,{now:true})}catch(e){}}return r})());
 if(nm)jobs.push(liveFind(q,null,50,{noG:true}).then(r=>Array.isArray(r)?r:[]).catch(()=>[]));
 let all=(nm?localFind(nm,null):[]).concat((await Promise.all(jobs)).flat());let err=null;
 if(!all.length){try{all=[await gmResolve(raw,null)]}catch(e){err=e.message}}
 const out=[];for(const x of all){if(!x||x.lat==null)continue;if(!out.some(o=>norm(o.name)===norm(x.name)&&hav(o,x)<2))out.push(x)}
 let res=srchRank(out,nm,null);res.forEach(x=>{x._tk=tripNearKm(x);x._ok=x._tk<=400||inTrip(x)===true});const exact=x=>norm(x.name)===norm(nm)||norm(noDia(x.name))===norm(noDia(nm));
 res=res.filter(x=>x._ok||x._tk<1500).sort((a,b)=>(b._ok-a._ok)||(exact(b)-exact(a))||((b._rel||0)-(a._rel||0))||(a._tk-b._tk)).slice(0,8);
 if(UI.res!==R)return;UI.res={q:nm,list:res,err,share:raw};shareSheet()}
function shareSheet(){const R=UI.res;if(!R)return;
 sheet(`<div class="sht">Geteilter Ort</div><div class="mut" style="margin:4px 0 12px">${esc(R.q||'')}</div>${R.load?`<div class="card kb"><div class="small mut"><span class="spin"></span>Suche den Ort …</div></div>`:R.list&&R.list.length?`<div class="card">${R.list.map((x,n)=>row({icn:x.saved?'pin':x.google?'star':'globe',t:esc(x.name),s:`${x.saved?'schon gespeichert · ':''}${x.gRating?'★ '+String(x.gRating).replace('.',',')+' · ':''}${esc(x.type||'')}`,a:`data-a="resPick" data-k="${n}"`})).join('')}</div>`:`<div class="card"><div class="empty small">Ort nicht gefunden${R.err?' ('+esc(R.err)+')':''}.</div></div>`}`)}

// ---------- Updates in der App und „Was ist neu“ ----------
const VER_SEEN='auszeit27_seen';let VER_PENDING=null;
function verBusy(){const a=document.activeElement;return sheetOpen()||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||!!UI.aiBusy||!!UI.aiChkBusy}
function verReload(v){let tried=null;try{tried=sessionStorage.getItem('auszeit27_reload')}catch(e){}if(tried===v){toast(`Neue Version ${esc(v)} ist da. <button class="tb" data-a="appUpdate">Jetzt laden</button>`,60000);return}
 if(verBusy()){VER_PENDING=v;return}try{sessionStorage.setItem('auszeit27_reload',v)}catch(e){}
 const go=()=>location.reload();if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)navigator.serviceWorker.getRegistration().then(r=>r?r.update().catch(()=>{}).then(go):go()).catch(go);else go()}
function verSheet(list,isNew){const show=list&&list.length?list:CHANGELOG.slice(0,4);
 sheet(`<div class="sht">${isNew?'Neu in Version ':'Version '}${esc(APP_VERSION)}</div><div class="mut" style="margin:4px 0 6px">${isNew?'Die App hat sich automatisch aktualisiert.':'Neue Versionen laden automatisch.'}</div>${show.map(c=>`${lbl(`Version ${esc(c.v)} · ${esc(c.d)}${c.v===APP_VERSION?' · aktuell':''}`)}<div class="card" style="padding:4px 14px">${c.items.map(i=>`<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;line-height:1.45;font-size:13px"><span style="color:var(--ok);padding-top:2px">${ic('check',14,2.4)}</span><span>${esc(i)}</span></div>`).join('')}</div>`).join('')}${btns(`<button class="btn p" style="flex:1" data-a="close">${isNew?'Alles klar':'Schließen'}</button>`)}`)}
function verNews(){let seen=null;try{seen=localStorage.getItem(VER_SEEN)}catch(e){}if(seen===APP_VERSION)return;try{localStorage.setItem(VER_SEEN,APP_VERSION)}catch(e){}
 const k=seen?CHANGELOG.findIndex(c=>c.v===seen):-1;const big=CHANGELOG.findIndex(c=>/^\d+\.\d+$/.test(c.v));const list=k>0?CHANGELOG.slice(0,k):CHANGELOG.slice(0,Math.max(1,big+1));
 setTimeout(()=>{if(!sheetOpen()&&ready())verSheet(list.slice(0,5),true)},900)}
function pwaInit(){if(!/^https?:/.test(location.protocol))return;
 if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
 const chk=async()=>{try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();if(j.version&&j.version!==APP_VERSION)verReload(j.version)}catch(e){}};
 setTimeout(chk,3000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk()})}

Object.assign(window.KIA=window.KIA||{},{
 chkC:(el)=>{UI.chkC=el.dataset.k;UI.keepY=true;render()},
 chkT:(el)=>{const id=el.dataset.k;S.chk=S.chk||{};if(S.chk[id])delete S.chk[id];else S.chk[id]=true;save();UI.keepY=true;render()},
 chkOpen:(el)=>chkSheet2(el.dataset.k),
 chkDel:(el)=>{const c=el.dataset.k,i=+el.dataset.i;const l=S.chkCustom?.[c];if(!l)return;const old=l.slice();const ch=Object.assign({},S.chk);l.splice(i,1);
  // Haken der nachrückenden eigenen Punkte mitziehen
  for(let k=i;k<old.length;k++){const a='cu_'+c+'_'+k,b='cu_'+c+'_'+(k+1);if(ch[b])S.chk[a]=true;else delete S.chk[a]}
  save();closeSheet();render();UI.undo=()=>{S.chkCustom[c]=old;S.chk=ch;save();render()};toast(`Punkt gelöscht. <button class="tb" data-a="undo">Rückgängig</button>`,5000)},
 chkKI:(el)=>{const c=el.dataset.k;UI.kiScope=c==='_g'?'all':c;kiTask('entry')},
 verAll:()=>verSheet(CHANGELOG.slice(0,6),false),appUpdate:()=>location.reload()});
document.addEventListener('submit',e=>{if(e.target.id==='chkF'){e.preventDefault();const v=($('#chkN')?.value||'').trim();if(!v)return;const c=UI.chkC;S.chkCustom=S.chkCustom||{};(S.chkCustom[c]=S.chkCustom[c]||[]).push(v.slice(0,200));save();UI.keepY=true;render();toast('Punkt hinzugefügt.')}});

applyTheme();

 if(raw){load();UI.raw=raw;render();navInit();setTimeout(()=>{loadFx().then(()=>{}).catch(()=>{})},800);setTimeout(shareIn,400);verNews()}else{S=null;emptyState()}pwaInit()})();
