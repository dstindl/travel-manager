 {v:'0.80_61',d:'25.11.2026',items:['Feste Farbstufen in der ganzen App: Etappe und Kopfkarten kräftig, Ausflüge mittel, Transport ganz zart – auch auf der Ausflugsseite, bei „Transport hinzufügen“ und in den Popups']},
 {v:'0.80_60',d:'25.11.2026',items:['Einheitliche Zeilen: Kennung links, Name, darunter Symbol + Datum im immer gleichen Format (Di 02.02.), Status-Punkt in einer Linie, Pfeil','Route: Ausflüge ohne Überschrift, jeder Ausflug als eigene Zeile mit Nummer und Pfeil – Antippen öffnet ihn direkt; ohne Tag steht „tt.mm.jjjj“','Ausflüge ohne Kategorie-Angabe; gebucht = grüner Punkt wie bei Hotel und Transport','Transport: Datum zuerst, dann Uhrzeit und Teilstrecken']},
 {v:'0.80_59',d:'25.11.2026',items:['Seitenköpfe als Karte: Land, Etappe, Ausflüge, Kosten, Notiz und Transfer zeigen Titel, Datum und Kennzahlen gebündelt in einer Kopfkarte in Landesfarbe','Ausflug-Transport mit T-Nummer wie in der Route (z. B. T4.1) und im gleichen Kartenfuß-Stil','Gebuchte Ausflüge tragen das Kennzeichen „gebucht“','Route: Ausflüge stehen jetzt in der Etappenkarte – unter der Etappe, über dem Transport, als eigener Bereich mit Nummer, Name und Tag']},
 {v:'0.80_58',d:'25.11.2026',items:['Einheitliches Bild in allen Ebenen: Ausflüge als pastellige Karten mit gefüllter Nummer, Transport darunter im schwächeren Kartenfuß mit Symbol und Status-Punkt in einer Linie','Transfer-Seite: Teilstrecken als Transport-Karten, Kacheln in Landesfarbe; Land, Kosten und Etappe ebenso','Popups zu Unterkunft, Kosten, Analyse, Aufenthalt, Transfer, Teilstrecken, Ausflug-Transport und Ausflug einplanen zeigen oben die Karte, um die es geht – im gleichen Stil wie die Route']},
 {v:'0.80_57',d:'24.11.2026',items:['Plausibilitätsprüfung beim Einlesen: Ist der Name ein Ort der Reise statt eines Hotels? Klingt er nach Ausflug? Ist die Unterkunft online bekannt (Google/OpenStreetMap)? – mit grünem Haken, Hinweis oder Warnung','Bekannte Unterkünfte bringen Position und Google-Maps-Link gleich mit','Booking.com-Mails werden besser erkannt: Hotelname aus Betreff und „Die Unterkunft … erwartet Sie“, Lage, Zahlung vor Ort, Frühstück, Telefon, Stornofrist']},
 {v:'0.80_56',d:'24.11.2026',items:['Buchung einlesen: „Originaltext ansehen“ in der Vorschau – der Text lässt sich dort korrigieren und neu auswerten','Unplausible Zeiten wie Check-out 00:00 werden ignoriert','Ist der erkannte Name nur ein Ort der Reise (z. B. Phong Nha), sucht die App weiter nach dem eigentlichen Hotelnamen']},
 {v:'0.80_55',d:'24.11.2026',items:['Neu: Ortsprüfung für Unterkünfte – liegt das Hotel weit weg vom Etappenort oder nennt die Adresse einen anderen Ort der Reise (z. B. Hanoi statt Đà Nẵng), gibt es einen deutlichen Hinweis','Gilt beim Einlesen (die App prüft dazu die Adresse online), direkt in der Unterkunft beim Eintragen und dauerhaft in der Analyse der Etappe','Beim Einlesen wird die gefundene Position gleich als Hotel-Position übernommen']},
 {v:'0.80_54',d:'24.11.2026',items:['Buchung einlesen prüft die Zuordnung: Nächte passen nicht zur Etappe, Ausflug-Datum außerhalb der Etappe, Transfer an einem anderen Tag, Ziel weit weg, Adresse in einem anderen Land, Tag schon belegt – mit deutlichem Hinweis','Unterkunft: neue Felder „Gebucht von/bis“ – die App zeigt sofort, ob die Nächte zur Etappe passen','Die Analyse der Etappe meldet dauerhaft, wenn Buchung und Etappe auseinanderlaufen (z. B. nach Verschieben), mit Vorschlag „Etappe auf X Nächte kürzen/verlängern“','Gebuchte Transfers an einem anderen Tag als der Anreise werden als Warnung statt nur als Hinweis gezeigt']},
 {v:'0.80_53',d:'24.11.2026',items:['Neu: „Gebucht über“ bei Unterkunft, Transfer und Ausflug – Schnellauswahl der gängigen Portale (Booking.com, Expedia, Agoda, Airbnb, 12Go, Bookaway, GetYourGuide, Viator, Klook …) oder Freitext','Buchung einlesen erkennt das Portal automatisch und unterscheidet Unterkunft, Transfer (Flug, Bus, Fähre, Zug) und Ausflug – die Art lässt sich in der Vorschau umschalten','Transfer-Buchungen: Datum, Abfahrt/Ankunft, Flugnummer, Airline, Strecke, Buchungsnummer, Preis; Auswahl des Transfers und der Teilstrecke','Ausflug-Buchungen: Titel, Datum, Beginn, Treffpunkt, Anbieter; bestehenden Ausflug wählen oder neuen anlegen','„Aus Buchungsmail / PDF einlesen“ jetzt auch im Transfer und im Ausflug-Transport; Bestätigung wird jeweils offline gespeichert','Geteilter Ort aus Google Maps kann jetzt auch Start oder Ziel eines Transfers werden']},
 {v:'0.80_52',d:'24.11.2026',items:['Neu: Buchung einlesen – aus Mailtext, PDF oder .eml. Erkennt Hotel, Adresse, Zeitraum, Check-in/-out-Zeiten, Buchungsnummer, Preis, Stornobedingung und Buchungslink (Expedia, Booking.com, Agoda, Airbnb u. a.)','Die passende Etappe wird über Datum und Ort vorgeschlagen, mit Hinweis, wenn die Daten abweichen','Teilen an Auszeit27 nimmt jetzt auch PDFs und Dateien an; Text aus Mails (markieren → Teilen) wird als Buchung erkannt','Die Bestätigung wird offline bei der Unterkunft gespeichert und lässt sich dort öffnen','Zu finden in der Unterkunft („Aus Buchungsmail / PDF einlesen“) und im Routenmenü •••']},
 {v:'0.80_51',d:'24.11.2026',items:['Unterkunft: „Hotel in Google Maps öffnen“ direkt bei Name und Adresse – der Link kommt automatisch beim Teilen oder aus der Suche','„Buchungslink (Bestätigung)“ ist jetzt nur noch für die Buchung, z. B. aus der Booking.com-Mail, mit „Buchung öffnen“ direkt daneben','Google-Maps-Links, die bisher im Buchungsfeld standen, wurden automatisch verschoben']},
 {v:'0.80_50',d:'24.11.2026',items:['Status-Punkte stehen direkt bei Hotel und Transport, alle in einer senkrechten Linie vor dem Pfeil – grün erledigt, gelb offen','Hotelname in gedämpfter Schrift','Transport: Wer „gebucht“ wählt, muss die Abfahrt eintragen – oder bewusst „Abfahrtszeit noch unbekannt“ wählen. Erst dann wird der Punkt grün','Bereits gebuchte Transporte ohne Abfahrt zeigen „Abfahrt fehlt“']},
 {v:'0.80_49',d:'24.11.2026',items:['Etappen-Karte dreizeilig: Ort, dann Kalender-Symbol mit Datum und Nächten, dann Bett-Symbol mit dem Hotel in voller Breite','Grüner Haken hinter dem Hotel, wenn gebucht – sonst bleibt der gelbe Punkt','Ohne Eintrag steht blass „Unterkunft offen“']},
 {v:'0.80_48',d:'24.11.2026',items:['Transport in der Route kürzer: „nach Kep“ statt „weiter nach Kep“','Verkehrsmittel als Symbol statt Text (Auto, Flug, Fähre …) direkt vor dem Datum']},
 {v:'0.80_47',d:'24.11.2026',items:['Neuer, ruhiger Farbstil in der ganzen App: Pastell-Mint als Akzent, Lavendel als zweite Farbe – Länder wechseln zwischen beiden','Etappen-Karten pastellig getönt, Transport in der gleichen Farbe deutlich schwächer','Zeitleiste im Ablauf ist jetzt die Kopfzeile: Zeitraum und Länder groß oben, darunter die Leiste mit Rahmen','Karten nutzen die volle Breite, das Datum mit Wochentag steht wieder in der Karte']},
 {v:'0.80_46',d:'23.11.2026',items:['Jedes Land hat jetzt eine eigene Farbe: Länderkopf, Streifen an jeder Etappe, Etappen-Nummer, Ebene-Markierung und Zeitverlauf. Antippen des Farbbalkens im Land ändert die Farbe','Transfers sind bewusst grau und gestrichelt abgesetzt – klar „zwischen“ den Etappen','Ablauf mit Zeitleiste: Sie bleibt beim Scrollen oben stehen, der helle Rahmen zeigt den sichtbaren Zeitraum und wandert mit. Antippen eines Abschnitts springt zur Etappe','Links neben jeder Etappe steht das Anreisedatum wie auf einem Zeitstrahl']},
 {v:'0.80_45',d:'23.11.2026',items:['Klassische Routenansicht entfernt – wer sie eingeschaltet hatte, landet automatisch wieder in der neuen Route']},
 {v:'0.80_44',d:'23.11.2026',items:['Etappe (Ebene 3) im neuen Raster: Anreise oben, Etappen-Karte mit Unterkunft, Nächten, Ausflügen, Kosten, Hinweisen und Notiz als Zeilen, Weiterreise unten – verbunden durch die Linie','Ausflüge (Ebene 4) chronologisch nach Tagen: jeder Ausflug als Karte mit Nummer, im Kartenfuß der Transport oder „Transport hinzufügen“; freie Tage als „frei“','Transfer-Seite: Teilstrecken als verbundene Karten mit T-Nummer und Verkehrsmittel, am Ende „Teilstrecke hinzufügen“']},
 {v:'0.80_43',d:'23.11.2026',items:['Route mit Umschalter Zeitverlauf | Ablauf: Ablauf zeigt die ganze Reise chronologisch mit Länderköpfen','Neues Raster für Etappen und Transfers: jede Etappe ist eine Karte, die Weiterreise steht im Kartenfuß – Nummer und T-Nummer, Datum und Status jeweils untereinander','Verbindungslinie zwischen den Karten, gestrichelt an Landesgrenzen; Anreise als eigene kleine Karte','Fehlende Weiterreise direkt im Kartenfuß hinzufügen','Gleiches Raster in der Länderansicht']},
 {v:'0.80_42',d:'23.11.2026',items:['Etappe hinzufügen in zwei Schritten: erst den Ort wählen, dann die Position in der chronologischen Etappenliste des Landes','Die Position mit dem kürzesten Umweg ist vorausgewählt und als „empfohlen“ markiert; die neue Etappe zeigt direkt An- und Abreisedatum und die Nächte','Beim geteilten Ort „Neue Etappe“ geht es direkt zur Positionswahl','Pop-ups öffnen immer oben; beim Aktualisieren desselben Fensters bleibt die Scrollposition erhalten']},
 {v:'0.80_41',d:'23.11.2026',items:['Geteilter Ort: Suche mit Name und Land aus Google Maps (z. B. „Mirissa, Sri Lanka“) und gleichzeitig über Google, OpenStreetMap und eure gespeicherten Orte','Der Ort selbst steht jetzt oben: exakte Namenstreffer vor Hotels und Restaurants mit ähnlichem Namen, eure Etappen und gespeicherten Orte zuerst']},
 {v:'0.80_40',d:'23.11.2026',items:['Alle Suchen bevorzugen jetzt immer eure Reiseländer (Einstellungen › Länder der Reise): Treffer dort stehen oben, Orte außerhalb rutschen nach unten','Google und OpenStreetMap suchen ohne Bezugspunkt in der Region eurer Reiseländer statt rund um den eigenen Standort','Gilt überall: Neuer Spot, Ausflug, Etappe, Transfer, Unterkunft, Abfahrtsort und geteilte Orte']},
 {v:'0.80_39',d:'23.11.2026',items:['Geteilter Ort: Google sucht zuerst nur in eurer Reiseregion – „Ella“ findet jetzt Ella in Sri Lanka statt Treffer in Deutschland','Treffer werden nach Nähe zu euren Etappen sortiert, weit entfernte Orte fallen weg','Google-Suche ohne Bezugspunkt (z. B. Neuer Spot › Weltweit) bevorzugt ebenfalls die Reiseregion statt des eigenen Standorts']},
 {v:'0.80_38',d:'23.11.2026',items:['Google-Tageslimit in der App (Einstellungen › Suche, Standard 100): danach sucht die App bis morgen nur über OpenStreetMap','Bei jedem Start mit erreichtem Limit ein Hinweisfenster, bei 80 % eine kurze Meldung','Google-Bewertungen (mit Option „mit Bewertungen“) werden überall angezeigt – mit Anzahl, z. B. ★ 4,0 (54) – und beim Speichern als Spot übernommen']},
 {v:'0.80_37',d:'23.11.2026',items:['Alle Suchfelder sehen gleich aus: rundes Feld mit Lupe und Löschen-Knopf – auch Atlas und Land hinzufügen','Vorschlagslisten unter Eingabefeldern (Unterkunft Name/Adresse, Abfahrtsort beim Ausflugs-Transport) im gleichen Zeilenstil wie die Suchmasken, mit Google-Markierung und Entfernung','Neu: Abfahrtsort beim Ausflugs-Transport mit Live-Vorschlägen (Google, OpenStreetMap, Bahnhöfe, Häfen, Google-Maps-Link, Koordinaten)','Alte Vorschlagsansicht entfernt: „Vorschläge“ öffnet überall dieselbe Maske „Ausflug hinzufügen“']},
 {v:'0.80_36',d:'23.11.2026',items:['Versionsanzeige auf dem Startbildschirm öffnet dasselbe Fenster wie nach einem Update: aktueller Stand und letzte Änderungen, mit Link zu allen Versionen','Nach dem Speichern einer Unterkunft oder dem Einfügen einer Etappe: „Etappe öffnen“ direkt in der Meldung','Geteilter Ort: Hinweis, wenn er schon als Spot, Ausflug, Etappe oder Unterkunft existiert – mit direktem Öffnen des bestehenden Eintrags; Warnung, wenn die gewählte Etappe schon eine andere Unterkunft hat','Meldungen mit „Öffnen“ werden nicht mehr von anderen Hinweisen überdeckt']},
 {v:'0.80_35',d:'23.11.2026',items:['Neue Versionen laden automatisch – sobald gerade nichts bearbeitet wird','Versionsstand oben auf dem Startbildschirm, antippen öffnet die Versionshinweise','Nach jedem Update erscheint einmal ein Fenster „Neu in Version …“ mit allen Änderungen seit dem letzten Öffnen']},
 {v:'0.80_34',d:'23.11.2026',items:['Teilen aus Google Maps: Die App sucht sofort und zeigt den Ort (mit Google-Schlüssel über Google, sonst über Link und OpenStreetMap)','Danach Auswahl: als Unterkunft für eine Etappe (nächste Etappe vorausgewählt, Name, Adresse, Position und Google-Link vorbefüllt), als Spot/Ausflug oder als neue Etappe','Bei mehreren Treffern den richtigen auswählen; ohne Treffer: selbst suchen oder auf der Karte wählen']},
 {v:'0.80_33',d:'22.11.2026',items:['Neu: Google-Suche mit eigenem Schlüssel (Einstellungen › Google-Suche) – zusätzliche Quelle in allen Suchmasken, bei Unterkünften zuerst','Geteilte Google-Maps-Orte werden mit Schlüssel über den Namen bei Google gefunden, auch wenn der Kurzlink nicht auflösbar ist','Schlüssel bleibt nur auf dem Gerät, nicht im Export; Zähler für Anfragen heute und im Monat','Google-Treffer werden kurz zwischengespeichert und erst nach einer Tipppause abgefragt, um das Gratiskontingent zu schonen']},
 {v:'0.80_32',d:'21.11.2026',items:['Neu: Position auf der Karte setzen – bei der Unterkunft („Auf Karte setzen“), bei Transfer Start/Ziel und bei Neuer Spot. Funktioniert für jeden Ort, auch wenn ihn keine Datenbank kennt','Unterkunft zeigt, ob eine Position gesetzt ist','App ist bereit für den Betrieb im Netz: installierbar, offline nutzbar, Hinweis bei neuer Version','Teilen aus Google Maps direkt an die App (wenn sie aus dem Netz installiert ist)']},
 {v:'0.80_31',d:'15.11.2026',items:['Google-Maps-Kurzlinks: zusätzlicher Auflösedienst (Jina Reader) als erster Versuch','Koordinaten in jedes Suchfeld einfügen, z. B. 21.0640, 105.8330 oder in Grad/Minuten/Sekunden – funktioniert immer, auch wenn kein Dienst den Link auflöst','Unterkunft: Wird nur der Name erkannt, wird er eingetragen; Koordinaten oder Link dann ins Feld Adresse einfügen']},
 {v:'0.80_30',d:'15.11.2026',items:['Google-Maps-Kurzlinks (maps.app.goo.gl) robuster: vier Weiterleitungsdienste nacheinander, Position und Name werden auch aus der Google-Seite gelesen','Geteilter Text mit Name, Adresse und Link funktioniert ganz ohne Weiterleitung: Position wird über die Adresse gesucht','Unterkunft aus Google-Maps-Link übernimmt jetzt auch die Adresse']},
 {v:'0.80_29',d:'15.11.2026',items:['Alle Suchmasken einheitlich aufgebaut: Titel, Quelle (Vorschläge, Gespeichert, Suche, Karte), ein Suchfeld mit Löschen-Knopf, eine Filterzeile mit Sortierung, Trefferzahl, gleiche Trefferzeilen','Trefferzeile ruhiger: Symbol mit Rollenpunkt, Name, eine Infozeile (Rolle · Kategorie · Fahrzeit · km · ★ · W), Hinweis nur bei Bedarf, runder +-Knopf','Kurzinfo, Karte, Google Maps und Wikipedia erst nach Antippen des Namens statt als feste Chips','Spezifische Filter: Ausflüge nach Quelle bzw. Tagestour-Radius, Etappe nach Land, Transfer nach Flughafen, Bahnhof, Busbahnhof, Hafen, Neuer Spot nach Bereich','Kein Suchen-Knopf mehr nötig, die Suche läuft beim Tippen']},
 {v:'0.80_28',d:'15.11.2026',items:['Alle Suchen einheitlich: Live-Treffer beim Tippen ab 2 Zeichen, ohne Eingabe Vorschläge in der Nähe – auch bei „Neuer Spot“','Einheitliche Sortierung nach Relevanz, Ausgewogen oder Entfernung (Einstellungen › Suche und direkt über den Treffern), Entfernung steht an jedem Treffer','Flughäfen von 64 auf über 160 erweitert (alle Reiseländer plus Laos und Singapur)','Neu: über 120 Bahnhöfe, Busbahnhöfe, Häfen und Fähranleger, auch als Vorschläge bei Transfer von/nach','Unterkunftssuche zusätzlich mit Hotels aus Nominatim und bereits gespeicherten Unterkünften','Google-Maps-Links: in jedes Suchfeld einfügen (auch Kurzlinks) oder mehrere Links bzw. eine Takeout-Datei (JSON/CSV) auf einmal importieren']},
 {v:'0.80_27',d:'15.11.2026',items:['Route neu als Hierarchie in fünf Ebenen: Route im Zeitverlauf › Land › Etappe › Kategorie › Detail','Ebene 1 zeigt alle Länder als Zeitbalken mit Heute-Linie und die nächsten To-dos','Ebene 2 (Land): Kacheln Etappen, Kosten, Einreise, Status und der Ablauf mit Etappen und Transfers T0, T1 …','Ebene 3 (Etappe): Kacheln Tage, Unterkunft, Ausflüge, Kosten, An- und Abreise, Hinweise, Notiz','Ebene 4: Ausflüge nach Tagen mit Vorschlägen, Kosten der Etappe, Notiz; Transfer als eigene Seite mit Teilstrecken und Prüfung','Pfad oben zum Zurückspringen, Punkte nur bei To-dos, klassische Ansicht über ••• weiter erreichbar']},
 {v:'0.80_26',d:'30.10.2026',items:['Transfers beginnen mit T0 (Anreise), danach T1 ab Etappe 1, T2 ab Etappe 2 …','Transporte zu Ausflügen tragen keine T-Nummer mehr, sondern die Ausflugsnummer (z. B. 1.1) – keine Verwechslung mit Transfer-Teilstrecken']},
 {v:'0.80_25',d:'30.10.2026',items:['Automatische Transfer-Prüfung beim Speichern: Wird eine Etappe angelegt, verschoben, entfernt oder ihre Unterkunft geändert, prüft die App die betroffenen Transfers (davor und danach) und zeigt Vorschläge direkt an – einzeln oder alle übernehmen, oder später','Fehlender Transfer nach einer neuen Etappe wird dabei gleich mit angeboten','Ausflug-Transport: weicht der Abfahrtsort von der Unterkunft ab, kommt beim Speichern ein Hinweis','Hinweis „Lange Fahrt“ schon ab ca. 450 km Luftlinie, mit geschätzter Fahrzeit']},
 {v:'0.80_24',d:'30.10.2026',items:['Jede neu angelegte Teilstrecke startet mit „gebucht“ und „bezahlt“: manuell, vorher/danach, T1 anlegen, „Transfer fehlt“ automatisch, Zubringer und alle übernommenen Prüf-Vorschläge']},
 {v:'0.80_23',d:'30.10.2026',items:['Karte: Transporte zu Ausflügen mit Verkehrsmittel-Symbol in der Mitte der Linie und T-Nummer als Abzeichen (z. B. T3.1), antippbar']},
 {v:'0.80_22',d:'30.10.2026',items:['Karte: Anreise T1 zeigt jede Teilstrecke einzeln (T1.1 Flug mit Flugsymbol, T1.2 Auto zum Hotel); alle Transfers starten und enden auf der Karte an der Unterkunft, sofern hinterlegt','Ausflüge: Abfahrtsort ist standardmäßig die Unterkunft der Etappe; Linien der Ausflüge auf der Karte beginnen an der Unterkunft','Automatisch angelegte Transfers beginnen und enden an den Unterkünften','Unterwegs: „von hier ca.“ zur Übernachtung rechnet bis zur Unterkunft','Fahrzeiten der Ausflüge (live) werden ab der Unterkunft berechnet und nach Änderung der Unterkunft neu ermittelt','Teilstrecke vorher/danach startet bzw. endet an der Unterkunft']},
 {v:'0.80_21',d:'30.10.2026',items:['Karte: Unterkünfte als Bett-Symbol mit Etappennummer als Abzeichen (antippen öffnet die Unterkunft); Transfer-Symbole mit T-Nummer als Abzeichen statt freiem Text','Teilstrecken zeigen immer ihr eigenes Verkehrsmittel-Symbol (auch in der Transferkarte jede Zeile); Teilstrecken ohne gespeichertes Verkehrsmittel werden einheitlich festgelegt, damit Symbol, Dauer und Prüfung übereinstimmen']},
 {v:'0.80_20',d:'30.10.2026',items:['Prüfung: Flug im selben Land bzw. über offene Landgrenze bis ca. 350 km Luftlinie → Empfehlung Auto/Bus (auch bei mehrteiligen Flugplänen mit Zubringern)','Prüfung: Unterkunft wird als Start und Ziel berücksichtigt – fehlt der Weg von bzw. zur Unterkunft (z. B. Flughafen → Hotel Awaken), wird ein Zubringer vorgeschlagen','Zubringer werden bei bekannter Unterkunft immer bis zur Unterkunft angelegt','Flughafen VDH korrekt als Đồng Hới benannt (nicht Phong Nha)']},
 {v:'0.80_19',d:'30.10.2026',items:['Gelöschte Anreise T1 lässt sich wieder anlegen: Karte „T1 Anreise fehlt“ vor der ersten Etappe (Flug ab Frankfurt zum nächsten Flughafen, bei Bedarf mit Zubringer) oder manuell; auch im Etappen-Pop-up']},
 {v:'0.80_18',d:'30.10.2026',items:['Prüfung läuft nach jeder Änderung neu: offene Prüf-, Analyse- und Etappen-Blätter aktualisieren sich automatisch (Transfer, Unterkunft, Nächte, Daten …)','Keine doppelten Hinweise mehr: Transfer-Themen nur noch in der Transferkarte, nicht zusätzlich als Etappen-Hinweis; Gesamt-Analyse zeigt Transfers in eigenem Abschnitt','Vorschlagslogik zurückhaltender: mehrteilige, in sich stimmige Pläne werden nicht mehr umgebaut; Umwandeln nur bei klaren Fällen (Flug unter 200 km mit Landweg, Auto/Bus ohne Landweg oder sehr lang); Zubringer erst ab 10 km Abstand zum Flughafen']},
 {v:'0.80_17',d:'30.10.2026',items:['Unterkunftssuche: nur Treffer im Land der Etappe, nur Unterkünfte (Hotel, Hostel, Gästehaus, Resort …), sortiert nach Entfernung zur Etappe, mit km-Angabe; wenn nichts gefunden wird, schrittweise breitere Suche']},
 {v:'0.80_16',d:'30.10.2026',items:['Unterkunft als Standard-Start und -Ziel: Transfers (außer Flug) beginnen an der Unterkunft der vorigen Etappe und enden an der Unterkunft der Etappe; Ausflüge rechnen ab der Unterkunft','Unterkunft: Suche während der Eingabe mit Vorschlägen (Name und Adresse), Auswahl füllt Name, Adresse und Position; Adressfeld mit eigener Adresssuche','Ausflug-Transport: Status und Bezahlt nebeneinander, wie bei Transfer und Unterkunft; gebucht und bezahlt überall in derselben Farbe']},
 {v:'0.80_15',d:'30.10.2026',items:['Transfer-Prüfung erweitert: gilt auch für die Anreise T1 (Start Frankfurt); erkennt doppelte Teilstrecken, Lücken und Sprünge in der Kette (Start ≠ vorheriges Ziel), Strecken ohne Länge, Auto/Bus über Kontinente; Start und Ziel des ganzen Transfers werden mit Vorort und Etappe abgeglichen','Vorher/Danach bei T1 startet korrekt in Frankfurt']},
 {v:'0.80_14',d:'30.10.2026',items:['Transfer: „Teilstrecken bearbeiten“ mit Löschen je Teilstrecke, ganzen Transfer löschen, vorher/danach hinzufügen','„Automatisch prüfen“ statt starrem Flug: Empfehlungen je nach Entfernung, Grenze und Seeweg (umwandeln, Zubringer ergänzen, überflüssige Strecken löschen), einzeln übernehmbar mit Rückgängig','Bearbeiten-Blatt eines Transfers mit „Löschen“','Fehler behoben: neue Teilstrecken wurden beim Speichern doch als „offen“ gespeichert']},
 {v:'0.80_13',d:'30.10.2026',items:['Teilstrecke vorher/danach: Start und Ziel werden aus der Nachbarstrecke vorbefüllt (bei Flug mit dem nächsten Flughafen)','„Automatisch“ gibt immer eine Rückmeldung und funktioniert auch bei Strecken ohne Flug','Neue Transporte und Unterkünfte standardmäßig „gebucht“; Status steht direkt neben „Bezahlt“, beide farbig (grün/gelb)']},
 {v:'0.80_12',d:'30.10.2026',items:['Transfer: Landesübertritt in eigener Zeile unter der Strecke; Entfernung in km im Kopf','Statt „weit entfernt“ echte Werte: lange Fahrzeiten als Tage und Stunden, Transfers zusätzlich in km','Teilstrecken: „+ Teilstrecke“ direkt in der Transferkarte (vorher, danach oder automatisch über die nächsten Flughäfen)','Wischgesten: im Pop-up zwischen Tabs, in Unterwegs zwischen Tagen, in der Route zwischen Ländern']},

 {v:'0.46',d:'28.10.2026',items:['„Ausflug hinzufügen“ und „Vorschläge“ zu einem Blatt zusammengeführt: Tabs Vorschläge, Gespeichert, Live-Suche, Karte','Alle Tabs mit derselben Zeilen-Darstellung: Name mit Kurzinfo zum Aufklappen, Fahrzeit, Status, Google-Link, „Hinzufügen“ direkt in der Zeile','Gespeichert nach Fahrzeit sortiert und in „Tagestour-Radius“ und „Weiter weg“ gegliedert','Titel einheitlich: „Ausflüge zu Etappe … hinzufügen“']},

 {v:'0.44',d:'28.10.2026',items:['Tagesleiste: Tipp auf einen Tag öffnet die Tagesplanung (Touren, Transfers, Zeitleiste); leere Tage mit „Ausflug für diesen Tag hinzufügen“','⋯-Menü der Etappe: „Analyse“ prüft Hinweise und Logikfehler und schlägt Korrekturen vor, einzeln oder alle auf einmal übernehmbar','Touren in der Route standardmäßig eingeklappt; Schalter „Ausflüge“ oben steuert alle, jede Etappe lässt sich einzeln öffnen','Kopfbereich der Route entschlackt: Landinfos in einer Zeile, Ansicht und Ausflüge-Schalter in einer Zeile','Kompakte Schrift (Standard, für Tablet und Handy), umschaltbar in den Einstellungen']},
 {v:'0.43',d:'28.10.2026',items:['Kurzinfo wird im Hintergrund für alle Orte vorgeladen (nacheinander, schonend) und gespeichert; neue Orte folgen automatisch','Kurzinfo auch im Tour-Popup und als Unterzeile in der Ausflugsliste','Hilfe „So funktioniert die Route“ über das ? in der Route: Etappe, Ausflug, Idee, Vorschlag, Priorität, Transfer']},
 {v:'0.42',d:'28.10.2026',items:['Detailseite neu: Kopf mit Art (Etappe, Ausflug, Idee), Priorität und Kategorien als Chips, Kurzfakten, Tabs','Etappe: Tab „Ausflüge“ steht vorn und ist beim Öffnen aktiv; Ausflüge nach Tagen, „Ohne Tag“, Vorschläge in der Umgebung','Ausflug: „Gehört zu Etappe“ mit Ändern, Tag und Transport als Zeilen','Kurzinfo (2–3 Sätze) oben im Überblick, ausführlich per „mehr lesen“','Seltenes unter „Mehr“: Name, Land, Zuordnung, Bewertung eintragen, Aus der Route, Löschen','Begriffe vereinheitlicht: Etappe, Ausflug, Idee statt Anker, angehängt, Inbox']},
 {v:'0.41',d:'28.10.2026',items:['Route neu gegliedert: Etappenkarte mit Tagesleiste, einzeiligen Touren mit Transport-Abzeichen, „Ohne Tag“ und Hinweise zugeklappt, Hinweise gebündelt mit direkter Aktion','Tour-Popup: Tag, Transport, Fahrzeit und Bewertung auf einen Blick, mit Details, Umhängen und Lösen','Mehrteilige Transfers als eine Karte mit Kette, aufklappbar','Offene Punkte (Orte ohne Etappe) oben im Land statt am Ende','Begriffe: „Ausflug hinzufügen“ statt „Ort anhängen“; Kopf der Etappe zeigt nur die Priorität','Fehler behoben: Teilstrecken endeten am Etappenziel statt am Start der nächsten Teilstrecke (falsche km und Zeit)','Fehler behoben: Orte, die einer Etappe zugeordnet sind, wurden zusätzlich als „bei keinem Anker“ gemeldet','Hinweis „keine Straßenverbindung“ ersetzt durch eine Fußnote: Fahrzeit geschätzt, weil die Strecke für die Live-Berechnung zu lang ist','Ausflüge mit sehr langer Fahrt schlagen eine eigene Etappe vor']},
 {v:'0.40',d:'28.10.2026',items:['Transport für Tagesausflüge: Auto, Taxi/Grab, Roller, Bus, Boot, Zu Fuß oder Geführte Tour, hin/zurück, Zeiten, Abfahrtsort, Anbieter, Kosten, Status, Notiz','Touren zeigen den Transport als eigene Zeile, eingeplante Touren ohne Transport mit „+ Transport“','Hinweise: offener Transport, Tour am Abreisetag vor dem Transfer','Unterwegs: Tagesablauf als Zeitleiste aus Transfers, Touren und Transporten','Karte: feine Linie vom Übernachtungsort zur Tour, wenn ein Transport eingetragen ist']},
 {v:'0.39',d:'28.10.2026',items:['„Etappe hinzufügen“ farbig hervorgehoben wie „Ort anhängen“']},
 {v:'0.38',d:'28.10.2026',items:['„Etappe hinzufügen“ mit demselben Auswahlblatt wie „Ort anhängen“: gespeicherte Orte mit Filter, Live-Suche und Auswahl auf der Karte','Beim Hinzufügen wählbar: nach welcher Etappe eingefügt wird und wie viele Nächte','Hinweise in der Auswahl: bereits in der Route, aktuell Ausflug eines Ankers, sehr nah an einem Anker']},
 {v:'0.37',d:'28.10.2026',items:['Neue Regel: Übernachtung = Anker = Hauptkarte. Jede Etappe ist Anker, „Kein Anker“ entfällt; Orte ohne Etappe sind Ausflugsziele oder Vorschläge','Statt Anker-Schalter: „Als Anker in die Route“ bzw. „Aus der Route nehmen“ in Status-Auswahl und Detailseite','Touren an einem Tag: Fahrzeit und Hinweise werden vom Übernachtungsort dieses Tages aus gerechnet','Einplanen an einem Tag mit anderem Übernachtungsort fragt, ob der Ort dorthin umgehängt werden soll','Automatische Zuordnung: Liegen Anker nah beieinander, bekommt der Anker mit mehr Nächten das Ziel','Bestandsdaten: Etappen ohne Anker werden Anker, Anker ohne Etappe werden Ausflugsziele']},
 {v:'0.36',d:'28.10.2026',items:['Etappenkarte mit fester Gliederung: Kopfzeile mit ⋯, Abschnitt „Planung“ (Datum, Nächte, Touren), Abschnitt „Hinweise“ (alle Infos und Warnungen gesammelt), Fußzeile mit Aktionen und Zuklappen','Umhängen frei wählbar: Auswahl aller Anker nach Entfernung, mit Option „Nur Vorschlag, ohne Anker“; bei Etappen ohne Anker bleibt die Übernachtung erhalten']},
 {v:'0.35',d:'28.10.2026',items:['Fehler behoben: Beim Tippen auf eine Wisch-Aktion schloss die Karte vorher und der Tipp landete auf dem Element darunter (z. B. Status statt „Anhängen“); betraf alle Wisch-Aktionen','Fehler behoben: Das ⋯-Symbol fehlte in allen Menüknöpfen','Begriffe: „Aus Route“ statt „Entfernen“ für Etappen, „Löschen“ nur noch, wenn ein Ort ganz gelöscht wird','Mehr Abstand in Etappen-, Tour- und Transferkarten']},
 {v:'0.34',d:'28.10.2026',items:['Aktionsfeld der Etappe neu formatiert: echte Knöpfe mit Abstand, „Mehr“-Menü klar erkennbar','Etappenkarte: Kopfzeile nach links wischen bietet „Anhängen“ (als Ausflug an den nächsten Anker) und „Entfernen“ (Etappe aus der Route)']},
 {v:'0.33',d:'28.10.2026',items:['Ausflugsnummern stabil: Die laufende Nummer (z. B. .2 in 1.2) wird beim Anhängen vergeben und bleibt; neue Orte bekommen die nächste freie Nummer, Lücken bleiben','Wechselt ein Ort den Anker, bekommt er dort die nächste freie Nummer; die Etappennummer davor folgt weiter der Route','„Neu nummerieren“ im ⋯-Menü der Etappe schließt Lücken','Jeder Ort hat eine feste Kennung (#001 …), sichtbar auf der Detailseite und in der Status-Auswahl']},
 {v:'0.32',d:'28.10.2026',items:['Einheitlich: Antippen einer Etappe öffnet immer die Detailseite des Ortes (vorher Anker → Umgebungsseite, sonst Detailseite)','Detailseite eines Ankers zeigt die Umgebung kompakt (Ziele je Band) mit Absprung zur Umgebungsseite','Detailseite: Grund für geschätzte Fahrzeit in eigener Zeile statt im schmalen Feld']},
 {v:'0.31',d:'28.10.2026',items:['Etappenkarte: Status (Anker, Priorität) gestapelt rechts neben Nummer und Name, antippbar; Datum mit „noch unverplant“ und Aktionen als eigene Felder','Status-Auswahl: FIX, Optional, Weitere oder keine Priorität sowie Anker an/aus, für jeden Ort jederzeit erreichbar','Detailseite: Priorität, Anker und Kategorien ganz oben','Gliederung: Datum immer mit Wochentag','Fehler behoben: Beim Umschalten auf „Kein Anker“ und zurück ging bei Orten aus den Startdaten (Hanoi, Đà Nẵng, Koh Rong) die Priorität FIX verloren; einheitliche Speicherung, Bestandsdaten werden angeglichen']},
 {v:'0.30',d:'28.10.2026',items:['Etappenkarte neu gegliedert: Name, eigene Statuszeile, Datumszeile mit Nächte-Regler, Touren integriert in einem eingesetzten Feld (keine Einzelkarten mehr), Aktions- und Fußzeile','Auf-/Zuklappen unten rechts in der Karte','Transfers: Symbol und Nummer in einem Abzeichen','Gliederung: gleich große Abzeichen in einer Spalte, Ausflüge eingerückt mit feiner Baumlinie, Statuspunkt links vom Datum']},
 {v:'0.29',d:'28.10.2026',items:['Route feiner: Etappen kompakter, Touren als schlanke Zeilen mit Tages-Zwischenüberschriften, Länderkopf in einer Zeile','Jede Etappe auf- und zuklappbar (Pfeil), Zustand wird gemerkt; zugeklappt mit Kurzübersicht','Transfers einheitlich als Karte im Stil der Hauptanreise, Status als Punkt, weitere Aktionen im ⋯-Menü','Gliederung feiner und mit Transfers zwischen den Etappen']},
 {v:'0.28',d:'28.10.2026',items:['Einstellungen: To-do-Liste für die weitere Entwicklung (abhaken, ergänzen, löschen)','Live-Fahrzeiten: Fehlschläge werden nicht mehr dauerhaft gespeichert, sondern nach 24 h erneut versucht; bei Überlastung des Dienstes kurze Pause und zweiter Versuch','Ortsseite zeigt, warum eine Fahrzeit nur geschätzt ist','Manuell angehängte Orte bis 300 km werden ebenfalls live berechnet']},
 {v:'0.27',d:'28.10.2026',items:['Fehler behoben: Gab es keinen deutschen Wikipedia-Artikel, blieb die Beschreibung leer. Jetzt Suche über mehrere Wege (deutscher Titel, Suche, englische Wikipedia, Wikidata, Artikel in der Nähe), englischer Text mit Kennzeichnung','Bekanntheit (Wikipedia-Sprachen) wird über den gefundenen Artikel ermittelt','Google-Bewertung: Eingabe direkt im Bewertungsfeld, Hinweis warum sie nicht automatisch kommt']},
 {v:'0.26',d:'27.10.2026',items:['Fehler behoben: Angehängte Orte ließen sich nur über den Namen öffnen, jetzt reagiert die ganze Karte','Datum an einer geplanten Tour antippen springt direkt in „Unterwegs“ zu diesem Tag','Unterwegs: Ist am gewählten Tag nichts geplant, zeigt die App die nächste geplante Tour mit Sprung dorthin']},
 {v:'0.25',d:'27.10.2026',items:['Farbwahl: bereits verwendete und zuletzt gewählte Farben stehen bei jeder Rolle und Transferart als Schnellauswahl bereit','Farben, die schon von einer anderen Art genutzt werden, sind schraffiert dargestellt und trotzdem wählbar','Option „Eine Farbe für alle Transferarten“']},
 {v:'0.24',d:'27.10.2026',items:['Einstellungen: Farben für Flug, Auto, Bus und Boot frei wählbar; gelten für Transferkarten, Linien und Symbole auf der Karte, mit Vorschau']},
 {v:'0.23',d:'27.10.2026',items:['Grenz-Transfers: im verlassenen Land am Ende eine kompakte Ausreise-Karte (gleiche Nummer, öffnet denselben Transfer); in „Alle“ und bei Mehrfachauswahl nur einmal','Aufenthaltsdauer je Land gegen die erlaubten Tage (visumfrei, Visum, ETA) mit Warnung bei Überschreitung','Unterwegs: Transfers des Tages oben in der Tagesansicht, auch am Ausreisetag']},
 {v:'0.22',d:'27.10.2026',items:['Fixdaten: Anreise- und Abreisedatum jeder Etappe per Pin fixierbar','Hart gesperrt: Änderungen, die ein fixiertes Datum verschieben würden (Nächte, Reihenfolge, Etappe einfügen oder löschen, Reisebeginn), werden blockiert','Bei Sperre Hinweis mit nächstem Fixdatum und Vorschlag zum Ausgleich innerhalb des Abschnitts']},
 {v:'0.21',d:'27.10.2026',items:['Route und Karte: „Mehrere“ erlaubt die Auswahl mehrerer Länder gleichzeitig (z. B. Vietnam + Kambodscha), sonst wie gehabt ein Land','Die Auswahl wird zwischen Route und Karte übernommen']},
 {v:'0.20',d:'27.10.2026',items:['Transfer-Nummern laufen über die ganze Reise (T1 = Anreise aus Deutschland, dann fortlaufend) und passen sich bei jeder Änderung an','Karte: Nummern an allen Transfers in jeder Ansicht, auch im Überblick','Karte: T1 Hauptanreise aus Deutschland als angedeutete Linie mit Symbol und Herkunft']},
 {v:'0.19',d:'27.10.2026',items:['Transfers nummeriert: T2 = Anreise zu Etappe 2, bei mehreren Teilen T2.1, T2.2','Karte zeichnet jeden Transfer-Teil einzeln ab den gesetzten Von/Nach-Orten (z. B. Flughafen) und aktualisiert sich nach jeder Änderung; Fußweg zum Flughafen als feine graue Linie','Mehrere Transfers einer Anreise per Pfeil nach oben/unten sortierbar']},
 {v:'0.18',d:'27.10.2026',items:['Route: Tab „Gesamt“ heißt jetzt „Überblick“, neuer Tab „Alle“ zeigt alle Etappen aller Länder komplett','Transfers per Wischen entfernen; ohne Transfer erscheint nur ein kleines Plus zwischen den Karten','Mehrere Transfers je Anreise möglich (z. B. Auto zum Flughafen, dann Flug)','Fehler behoben: Von, Nach und Datum eines Transfers wurden beim Speichern fest übernommen und folgten danach keinen Routenänderungen mehr; jetzt automatisch, solange nicht bewusst geändert. Bestehende Daten werden bereinigt, abweichende Daten werden markiert']},
 {v:'0.17',d:'27.10.2026',items:['Transfers: Von/Nach aus den Reisepunkten wählen oder live suchen (z. B. „Da Nang Airport“), Entfernung und Flugzeit dann ab diesen Punkten','Grenzübertritt: Transfer-Karte zeigt die Einreise-Checkliste des Ziellandes mit Fortschritt und fälligen Punkten, im Bearbeiten-Blatt mit den offenen Punkten und Absprung']},
 {v:'0.16',d:'27.10.2026',items:['Fehler behoben: Bei geraden Verbindungen (Auto, Bus, Boot) lag das Symbol unter dem Zielort statt in der Mitte der Linie','Karte: Schalter „Transfers“ blendet Verbindungslinien und Symbole ein oder aus (auch im Kartenstil-Menü)','Hinweis bei langen Einzeltouren sprachlich korrigiert']},
 {v:'0.15',d:'27.10.2026',items:['Karte: Auto, Bus und Boot schauen in Fahrtrichtung (gespiegelt), Pfeil bleibt','Karte: Anker mit Etappennummer 1, 2, 3 …, angehängte Orte mit 1.1, 1.2 …','Detailkarte auf der Karte und Ortsseite zeigen die Routennummer (Etappe oder Ausflug) mit Datum']},
 {v:'0.14',d:'27.10.2026',items:['Karte: Verkehrsmittel-Symbol zeigt mit Pfeil in Richtung Ankunftsort, das Flugzeug dreht sich in Flugrichtung']},
 {v:'0.13',d:'27.10.2026',items:['Karte: Verbindungen zwischen Etappen gestrichelt je Verkehrsmittel (Flug als Bogen), mit Symbol in der Mitte','Route: Jede Anreise ist eine eigene Karte in der Farbe des Verkehrsmittels; Flüge mit Von/Nach, Datum, Abflug/Ankunft, Flugnummer, Airline, Buchungscode und Status','Anreise antippen öffnet die Bearbeitung inkl. Wechsel des Verkehrsmittels']},
 {v:'0.12',d:'27.10.2026',items:['Live-Suche ohne Eingabe: zeigt bekannte Orte im Umkreis, nach Bekanntheit sortiert','Live-Suche mit Eingabe: fehlertolerant (Teilwörter, ohne Akzente), kombiniert Photon, Nominatim und Wikidata','Knöpfe in Auswahlblättern bleiben unten sichtbar']},
 {v:'0.11',d:'27.10.2026',items:['Route: Jeder Anker ist eine große Karte, angehängte Orte darin als eigene Karten 1.1, 1.2 …, getrennt nach „Geplant“ und „Angehängt, noch ohne Tag“','„Ort anhängen“: beliebige Orte aus gespeicherten Orten, Live-Suche oder per Tippen auf die Karte an einen Anker hängen (Mehrfachauswahl)','Nur FIX und Optional hängen automatisch an; Weitere bleiben Vorschläge, bis ihr sie anhängt','Wischen auf angehängten Karten: Tag, Anker (eigene Übernachtung), Lösen','Neue Ansicht „Gliederung“: ganze Route kompakt durchnummeriert']},
 {v:'0.10',d:'27.10.2026',items:['Fehler behoben: Live-Fahrzeiten scheiterten mit HTTP 400 (zu große bzw. zu weite Abfragen); jetzt kleinere Pakete, max. 150 km, einzelne nicht erreichbare Orte brechen die Abfrage nicht mehr ab','Sicherheitslage: Das Auswärtige Amt erlaubt keinen direkten Abruf aus dem Browser, daher Abruf über einen öffentlichen Weiterleitungsdienst (abschaltbar)','Fehlermeldungen der Dienste werden im Klartext angezeigt']},
 {v:'0.9',d:'26.10.2026',items:['Touren und Ideen in der Route als eigene Mini-Karten mit mehr Abstand','Wischen nach links: geplante Tour austragen oder Tag ändern, Idee einplanen oder löschen','Google-Bewertung überall sichtbar (Wert oder Link zu Google Maps), auch bei Vorschlägen und Suchtreffern','Umgebungsvorschläge ohne historische Regionen und Großräume (z. B. Französisch-Indochina)']},
 {v:'0.8',d:'26.10.2026',items:['Live-Fahrzeiten: Abfrage ohne Vorab-Anfrage (GET), damit sie auch beim Öffnen der Datei vom Handy funktioniert','Verbindungstest in den Einstellungen: prüft alle Live-Dienste einzeln und zeigt den Fehler','Hinweis, wenn Live-Fahrzeiten nicht erreichbar sind, statt still bei der Schätzung zu bleiben']},
 {v:'0.7',d:'26.10.2026',items:['Touren und Ausflugsideen: Name in eigener Zeile, immer voll lesbar','Fahrzeiten werden mit Internet automatisch live berechnet (Straßennetz OpenStreetMap), ohne Internet per Formel','Gehzeit zusätzlich bei kurzen Distanzen (bis 6 km), live oder per Formel','Kennzeichnung live/geschätzt an jeder Zeit']},
 {v:'0.6',d:'26.10.2026',items:['Route: Unter jeder Etappe „Hier schlaft ihr“ mit Nächten und darunter eingerückt die geplanten Touren nach Tag','Ausflugsideen je Anker einklappbar, Einplanen per Tageswahl aus dem Aufenthalt (mit Anzeige, was am Tag schon geplant ist)','Hinweis bei zu vollen Tagen und bei Touren, deren Datum außerhalb der Reise liegt','Ausflugsnummer (z. B. 5.1) bleibt als Kennung, sortiert wird nach Datum']},
 {v:'0.5',d:'26.10.2026',items:['Anker an/aus direkt an jeder Etappe: Übernachtung ohne Anker-Funktion möglich, der Ort zählt dann als Ausflug des nächsten Ankers','Hinweis „nahe an anderem Anker“ bietet jetzt „Kein Anker“ (Nächte bleiben) oder „Ausflug“ (Etappe entfällt)','Fehler behoben: Etappen wurden beim Öffnen immer wieder zu Ankern gemacht']},
 {v:'0.4',d:'26.10.2026',items:['Neue Logik: Jeder Übernachtungsort der Route ist ein Anker, Ziele mit Übernachtung werden als eigener Anker eingeplant, „Zwischenstopp“ entfällt','Anker behalten ihre Priorität (FIX, Optional, Weitere) als Label und Farbe','Ausflüge je Anker in der Route mit Nummerierung 1.1, 1.2 … und Label/Farbe je Priorität','Nummerierung der Etappen in der Farbe der Priorität','Hinweis, wenn ein Anker als Tagesausflug von einem anderen Anker erreichbar ist, mit Umwandlung in einen Ausflug']},
 {v:'0.3',d:'25.10.2026',items:['Farben für Anker, FIX, Optional und Weitere, in den Einstellungen änderbar','Checklisten vor Einreise je Land (inkl. Indonesien) mit Fristen ab Einreisedatum und offiziellen Links','Sicherheitslage live vom Auswärtigen Amt beim Öffnen, Bewertung je Ziel (Region, Grenzabstand)','Standortfreigabe und Debug-Modus mit simuliertem Standort (Ort oder Land)','Live-Suche: Google-Suche und Google Maps je Treffer, bereits gespeicherte oder geplante Orte werden markiert','Google-Bewertung je Ort (manuell, Startwerte aus euren Listen) neben der Zahl der Wikipedia-Sprachen','Indonesien als Land ergänzt']},
 {v:'0.2',d:'25.10.2026',items:['Karte: CARTO ersetzt (verlangte API-Key), jetzt Esri Dunkel ohne Key, umschaltbar auf Satellit, OpenStreetMap und Topo; automatischer Wechsel bei Kachelfehlern','Karte: Gesamtansicht zoomt korrekt auf die Route, Beschriftungen erst ab mittlerer Zoomstufe','Umgebungssuche je Anker über Wikidata statt Overpass: schneller, mit Zeitlimit, sortiert nach Bekanntheit','Live-Suche „Nähe Anker“ zeigt nur Treffer in diesem Umkreis, Land wird angezeigt','Weit entfernte Treffer zeigen „weit entfernt“ statt unsinniger Stundenzahlen']},
 {v:'0.1',d:'25.10.2026',items:['Erster Appstand: Reise, Atlas (Anker & Umgebung), Karte, Route, Unterwegs','Daten Vietnam und Kambodscha aus den Google-Maps-Listen, übrige Länder als Entwurf aus Reiseplan v3','Automatische Zuordnung jedes Ziels zum nächsten Anker mit Entfernungsbändern (in den Einstellungen anpassbar)','Live-Daten über OpenStreetMap: Suche, Tippen auf die Karte, Umgebungssuche je Anker, Fahrzeiten','Beschreibungen aus Wikipedia, Links zu Wikivoyage, Google Maps und OpenStreetMap','Import von Google-Maps-Listen (CSV aus Google Takeout), Export und Import als JSON']}

function makeAnchor(p){if(p.role==='anchor')return;p.prio=PRIO_ORD[p.role]!=null?p.role:null;p.baseAnchor=false;p.role='anchor';p.anchorId=null;p.attached=false;p.manualMin=null}
function unAnchor(p){if(p.role!=='anchor')return;p.role=p.prio||'wei';delete p.prio;delete p.baseAnchor;delete p.fix}
function isAttached(p,aid){if(p.role==='anchor'||p.role==='inbox')return false;if(p.attached&&p.anchorId)return p.anchorId===aid;if(p.detachedFrom===aid)return false;if(p.role!=='fix'&&p.role!=='opt')return false;const as=assign(p);return !!as&&as.a.id===aid&&as.band<=1}
function excursionsRaw(aid){return S.places.filter(p=>isAttached(p,aid)).map(p=>({p,as:assign(p)})).sort((a,b)=>(PRIO_ORD[a.p.role]??3)-(PRIO_ORD[b.p.role]??3)||(a.as?.min??0)-(b.as?.min??0))}

function travel(p,a){
 if(p.manualMin!=null&&p.anchorId===a.id)return{min:p.manualMin,src:'manuell'};
 const t=p.travel&&p.travel[a.id];if(t&&t.min!=null)return{min:t.min,km:t.km,walk:t.walk,src:'live'};
 const base=(typeof stayLL==='function'&&stayLL(a.id))||a;const km=hav(p,base);return{min:estMin(km),km:Math.round(km),src:'Schätzung'};
}
function assign(p){
 if(p.role==='anchor')return null;
 let list=anchors();if(!list.length)return null;
 if(p.anchorId){const a=byId(p.anchorId);if(a&&a.role==='anchor'){const t=travel(p,a);return{a,...t,band:bandOf(t.min),manual:true}}}
 const all=list.map(a=>({a,...travel(p,a)})).sort((x,y)=>x.min-y.min);let best=all[0];
 if(best&&all.length>1){const nm=nightsOf();const close=all.filter(x=>x.min<=best.min+30&&bandOf(x.min)===bandOf(best.min));if(close.length>1)best=close.sort((x,y)=>(nm[y.a.id]||0)-(nm[x.a.id]||0)||x.min-y.min)[0]}

}

async function loadWiki(p){
 const box=()=>document.getElementById('wikiBox');
 if(p.wikiMiss&&Date.now()-p.wikiMiss<864e5){const b=box();if(b)b.innerHTML='Keine Kurzinfo gefunden, auch nicht auf Englisch. Eigene Beschreibung in die Notiz schreiben. <span class="click" style="color:var(--pet2)" data-a="wikiRetry" data-id="'+p.id+'">Erneut suchen</span>';return}
 try{const r=await resolveWiki(p);if(!r){p.wikiMiss=Date.now();save();throw new Error('nichts')}
  if(r.lang==='de')p.wikiTitle=r.title;else p.wikiEn=r.title;if(r.qid&&!p.qid)p.qid=r.qid;delete p.wikiMiss;save();
  if(UI.pages.at(-1)?.id===p.id)rerenderPage();
 }catch(e){const b=box();if(b)b.innerHTML=navigator.onLine?'Keine Kurzinfo gefunden, auch nicht auf Englisch. Eigene Beschreibung in die Notiz schreiben. <span class="click" style="color:var(--pet2)" data-a="wikiRetry" data-id="'+p.id+'">Erneut suchen</span>':'Offline. Die Beschreibung wird beim nächsten Öffnen mit Internet geladen.'}
}
async function loadWdLinks(p){try{let q=p.qid;
 if(!q){const lang=p.wikiTitle?'de':p.wikiEn?'en':'de';const t=p.wikiTitle||p.wikiEn||p.wiki;const j=await getJSON(`https://${lang}.wikipedia.org/w/api.php?action=query&prop=pageprops&ppprop=wikibase_item&titles=${encodeURIComponent(t)}&redirects=1&format=json&origin=*`);q=Object.values(j.query?.pages||{})[0]?.pageprops?.wikibase_item}
 if(!q)return;const i=await wdInfo([q]);p.qid=q;p.wdLinks=i[q]?.links??null;save();const e=document.getElementById('wdl');if(e&&p.wdLinks!=null)e.textContent='Wikipedia in '+p.wdLinks+' Sprachen'}catch(e){}}
function findExisting(x){return S.places.find(p=>(x.qid&&p.qid===x.qid)||(x.osm&&p.osm===x.osm)||(p.role!=='anchor'&&hav(p,x)<0.15)||norm(p.name)===norm(x.name))}
function existTag(p){if(!p)return '';const st=stagesDated().filter(s=>s.placeId===p.id);if(st.length)return `<span class="tag fix">in Route ${fmtD(st[0].from)}</span>`;if(p.planned)return `<span class="tag gr">eingeplant ${fmtD(new Date(p.planned+'T12:00:00'))}</span>`;return `<span class="tag ghost">gespeichert als ${ROLES[p.role]}</span>`}
function bindPlace(id){const p=byId(id);if(!p)return;
 const nm=$('#fName');if(nm)nm.onchange=e=>{const v=e.target.value.trim();if(v){p.name=v;save();rerenderPage()}};
 const n=$('#fNote');if(n)n.onchange=e=>{p.note=e.target.value;save()};
 const a=$('#fAnchor');if(a)a.onchange=e=>{const v=e.target.value;if(v)attachTo(p,v);else{p.anchorId=null;p.attached=false}save();rerenderPage()};
 const m=$('#fMin');if(m)m.onchange=e=>{const v=e.target.value;p.manualMin=v===''?null:Math.max(0,+v);if(p.manualMin!=null&&!p.anchorId){const as=assign(Object.assign({},p,{manualMin:null}));p.anchorId=as?.a.id||null}save();rerenderPage()};
 const d=$('#fPlan');if(d)d.onchange=e=>{p.planned=e.target.value||null;save()};
 const c=$('#fCountry');if(c)c.onchange=e=>{p.country=e.target.value;save()};
 const gr=$('#fGR');if(gr)gr.onchange=e=>{const v=parseFloat(e.target.value.replace(',','.'));p.gRating=v>=1&&v<=5?Math.round(v*10)/10:null;save();rerenderPage()};
 const gc=$('#fGC');if(gc)gc.onchange=e=>{const v=parseInt(e.target.value,10);p.gCount=v>0?v:null;save();rerenderPage()};
}

 try{let a=null;if(UI.searchScope==='pos'){const ps=await getPos();a=ps;UI.posName=ps.name||'deinem Standort'}else if(UI.searchScope)a=byId(UI.searchScope);

function parseCsv(t){const rows=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){v+='"';i++}else q=false}else v+=c}else if(c==='"')q=true;else if(c===','){r.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}

function dayWarn(dIso){const l=S.places.filter(x=>x.planned===dIso&&x.role!=='anchor');const t=l.map(x=>dayTravel(x)).filter(Boolean).filter(a=>a.min>S.settings.bands[0]);const sum=t.reduce((a,x)=>a+x.min,0);return t.length>1?`voller Tag: ${t.length} Touren, Fahrt bis ca. ${fmtMin(sum*2)}`:sum>180?`lange Tour: ca. ${fmtMin(sum*2)} Fahrt hin und zurück`:''}

let LIVE_RUN=false,LIVE_FAIL=false;
async function liveBatch(a,part,retry){
 let car;try{car=await valMatrix(a,part,'auto')}catch(e){
  if(/429|503|Zeitüberschreitung/.test(e.message)&&!retry){await new Promise(r=>setTimeout(r,2500));return liveBatch(a,part,true)}
  if(part.length===1)return [{err:errTxt(e)}];
  const h=Math.ceil(part.length/2);return [...await liveBatch(a,part.slice(0,h)),...await liveBatch(a,part.slice(h))]}
 const near=part.filter(p=>hav(p,a)<6);let walk=[];if(near.length){try{walk=await valMatrix(a,near,'pedestrian')}catch(e){}}
 return part.map((p,j)=>car[j]&&car[j].min!=null?{min:car[j].min,km:car[j].km,walk:near.indexOf(p)>=0?walk[near.indexOf(p)]?.min??null:null}:{err:'keine Live-Route (Strecke zu lang oder abseits der Straßen)'})}
async function autoLive(){
 if(LIVE_RUN||LIVE_FAIL||!navigator.onLine)return;LIVE_RUN=true;let changed=0,ok=0,errs=[];
 try{const anc=[...new Set(S.stages.map(s=>s.placeId))].map(byId).filter(p=>p&&p.role==='anchor'&&country(p.country).status==='geplant');
  for(const a of anc){
   const t=S.places.filter(p=>{if(p.role==='anchor'||p.role==='inbox')return false;const d=hav(p,a);if(!(d<150||(p.attached&&p.anchorId===a.id&&d<300)))return false;const tr=p.travel&&p.travel[a.id];const hk=(()=>{const h=typeof stayLL==='function'&&stayLL(a.id);return h?h.lat.toFixed(4)+','+h.lon.toFixed(4):''})();if(!tr||tr.v!==3||(tr.hk||'')!==hk)return true;return tr.min==null&&Date.now()-(tr.ts||0)>864e5});
   for(let i=0;i<t.length;i+=20){const part=t.slice(i,i+20);const hl=typeof stayLL==='function'&&stayLL(a.id);const hk=hl?hl.lat.toFixed(4)+','+hl.lon.toFixed(4):'';const r=await liveBatch(hl?{...a,lat:hl.lat,lon:hl.lon}:a,part);
    part.forEach((p,j)=>{p.travel=p.travel||{};const x=r[j]||{};if(x.err)errs.push(p.name+': '+x.err);else if(x.min!=null)ok++;p.travel[a.id]=x.err?{min:null,v:3,err:x.err,ts:Date.now(),hk}:{min:x.min,km:x.km??null,walk:x.walk??null,v:3,ts:Date.now(),hk};changed++})}}
  S.liveErr=errs.length?errs.slice(0,3).join('; ')+(errs.length>3?' …':''):null;
 }catch(e){LIVE_FAIL=true;S.liveErr=errTxt(e);toast(`Live-Fahrzeiten nicht erreichbar (${esc(S.liveErr)}). Es bleiben Schätzwerte.`,7000)}
 LIVE_RUN=false;if(changed){save();if(errs.length&&!ok)toast(`Live-Fahrzeiten: keine Route gefunden (${esc(errs[0])}).`,7000);if(UI.pages.length)rerenderPage();else if(UI.tab==='route'||UI.tab==='atlas'||UI.tab==='unterwegs')render()}
}

const dDiff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
function pinCheck(st){let d=D0();for(let k=0;k<st.length;k++){const s=st[k];const f=iso(d);d=addDays(d,s.nights);const t=iso(d);
 if(s.pinFrom&&s.pinFrom!==f)return{k,b:k,s,which:'from',exp:s.pinFrom,act:f};if(s.pinTo&&s.pinTo!==t)return{k,b:k+1,s,which:'to',exp:s.pinTo,act:t}}return null}
function pinBounds(st){const b=[];st.forEach((s,k)=>{if(s.pinFrom)b.push(k);if(s.pinTo)b.push(k+1)});return b}
function fillGaps(order){for(let n=0;n<8;n++){const v=pinCheck(order);if(!v)return {order};if(v.which!=='from')return {fail:v};const diff=dDiff(v.exp,v.act);const k=v.k;const prev=order[k-1];
  if(diff>0){if(k===0)return {fail:v};if(prev.gap)prev.nights+=diff;else order.splice(k,0,{id:uid(),placeId:prev.placeId,country:prev.country,nights:diff,gap:true,legs:[]});continue}
  if(prev&&prev.gap&&prev.nights>-diff){prev.nights+=diff;continue}if(prev&&prev.gap&&prev.nights===-diff){order.splice(k-1,1);continue}return {fail:v}}return {fail:pinCheck(order)}}
function tryStages(mut,changed,label){
 const copy=S.stages.map(x=>({...x}));mut(copy);{const g=fillGaps(copy);if(g.order){const had=S.stages.filter(x=>x.gap).length,now=g.order.filter(x=>x.gap).length;S.stages=g.order;if(now>had)setTimeout(()=>toast('Fixiertes Datum bleibt: davor ist jetzt eine Lücke mit freien Nächten.',5000),50);return true}}const v=pinCheck(copy);
 if(!v){S.stages=copy;return true}
 const diff=dDiff(v.act,v.exp);const lo=Math.max(0,...pinBounds(copy).filter(x=>x<v.b));
 let best=null;for(let j=lo;j<v.b;j++){const c=copy[j];if((changed||[]).includes(c.id))continue;if(c.nights-diff<1)continue;
  const test=copy.map(x=>({...x}));test[j].nights-=diff;if(!pinCheck(test)&&(!best||c.nights>best.n))best={j,n:c.nights,test}}
 const pn=byId(v.s.placeId)?.name||'';
 UI.pinFix=best?best.test:null;
 toast(`${ic('pin',14,'#d2b479')} <b>Nicht möglich:</b> ${esc(label||'Änderung')} würde das Fixdatum ${fmtD(new Date(v.exp+'T12:00:00'))} verschieben (${v.which==='from'?'Anreise':'Abreise'} ${esc(pn)}).<br><span class="click b" style="color:#a9d6cf" data-a="unpinOne" data-i="${S.stages.findIndex(x=>x.id===v.s.id)}" data-w="${v.which}">🔒 Fixierung von ${esc(pn)} lösen</span>${best?` · <span class="click b" style="color:var(--pet2)" data-a="pinFix">Ausgleich: ${diff>0?diff+' '+(diff===1?'Nacht':'Nächte')+' weniger':(-diff)+' '+(-diff===1?'Nacht':'Nächte')+' mehr'} bei ${esc(byId(copy[best.j].placeId)?.name||'')}</span>`:' Erst den Pin lösen oder vorher im Abschnitt umverteilen.'}`,9000);
 return false}

function plNorm(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase().replace(/[^a-z0-9]/g,'')}
function plKeys(n){const w=String(n||'').split(/[\s,\-–()]+/).filter(Boolean);const k=[plNorm(n)];if(w.length>1&&plNorm(w[0]).length>=5)k.push(plNorm(w[0]));if(w.length>1)k.push(plNorm(w.slice(0,2).join('')));return [...new Set(k.filter(x=>x.length>=4))]}
function stayPlaceCheck(i,h,geo){const st=S.stages[i];const p=st&&byId(st.placeId);if(!p||!h)return null;const ll=h.ll||geo;
 const others=[...new Map(S.stages.filter(o=>!o.gap&&o.placeId!==p.id).map(o=>[o.placeId,byId(o.placeId)])).values()].filter(Boolean);
 if(ll&&ll.lat!=null&&p.lat!=null){const d=hav(ll,p);if(d<=40)return null;let nb=null,nd=1e9;others.forEach(o=>{if(o.lat==null)return;const x=hav(ll,o);if(x<nd){nd=x;nb=o}});
  return {lvl:d>150?'err':'warn',t:`${esc(h.name||'Die Unterkunft')} liegt ca. ${Math.round(d)} km von ${esc(p.name)} entfernt${nb&&nd<d/2&&nd<60?` – passt eher zu ${esc(nb.name)} (ca. ${Math.round(nd)} km)`:''}`,d}}
 const txt=plNorm((h.addr||'')+' '+(h.name||''));if(!txt)return null;if(plKeys(p.name).some(k=>txt.includes(k)))return null;
 const hit=others.find(o=>plKeys(o.name).some(k=>txt.includes(k)));return hit?{lvl:'err',t:`Die Adresse nennt ${esc(hit.name)}, die Etappe ist ${esc(p.name)}`}:null}
function stayCover(s,bkIn,bkOut){if(!s||!bkIn)return null;const bi=new Date(bkIn+'T12:00:00'),bo=bkOut?new Date(bkOut+'T12:00:00'):addDays(bi,1);const bn=Math.max(0,Math.round((bo-bi)/864e5));
 const cov=Math.max(0,Math.round((Math.min(bo,s.to)-Math.max(bi,s.from))/864e5));const miss=s.nights-cov,extra=bn-cov;if(!miss&&!extra)return null;

 {const ctr=(typeof CTRY_CAT!=='undefined'&&CTRY_CAT[s.country])?CTRY_CAT[s.country][2]:null;if(ctr&&hav(p,{lat:ctr[0],lon:ctr[1]})>2500)out.unshift({lvl:'err',t:`${esc(p.name)} liegt nicht in ${esc(country(s.country).name)} (ca. ${Math.round(hav(p,{lat:ctr[0],lon:ctr[1]}))} km vom Land entfernt). Visum, Checkliste und Währung stimmen so nicht.`,fix:'Aus der Route nehmen',act:{k:'unstage',i}})}

function distToLine(p,line){let best=1e9;for(let i=1;i<line.length;i++){const a={lon:line[i-1][0],lat:line[i-1][1]},b={lon:line[i][0],lat:line[i][1]};

async function refreshSecurity(force){
 const ids=S.countries.map(c=>c.id);const old=S.sec||{};
 if(!force&&old.ts&&Date.now()-old.ts<6*3600e3)return;
 if(!navigator.onLine)return;
 try{const j=await aaGet(AA);const list=j.response||{};const out={ts:Date.now(),c:{}};
  for(const [id,v] of Object.entries(list)){if(!v||typeof v!=='object'||!ids.includes(v.countryCode))continue;
   const e={id,flags:{w:!!v.warning,pw:!!v.partialWarning,sw:!!v.situationWarning,spw:!!v.situationPartWarning},mod:v.lastModified,title:v.title,sent:[]};
   try{const d=await aaGet(AA+'/'+id);const r=d.response?.[id]||Object.values(d.response||{}).find(x=>x&&x.content);const txt=stripHtml(r?.content);
    e.sent=[...new Set(txt.split(/(?<=[.!?])\s+/).filter(s=>/gewarnt|abgeraten|Reisewarnung|Teilreisewarnung/i.test(s)&&s.length<400))].slice(0,12);
    e.bsent=[...new Set(txt.split(/(?<=[.!?])\s+/).filter(s=>/(Grenzübergang|Grenzübergänge|Landgrenz|Grenzpunkt|Grenzkontroll|Grenze)/i.test(s)&&/(geschlossen|gesperrt|Schließung|geschloss|nicht passierbar|eingestellt|wieder geöffnet|wiedereröffnet|geöffnet|passierbar)/i.test(s)&&s.length<500))].slice(0,10);
    const km=/(\d+)\s*km\s*zum\s*Grenzverlauf/i.exec(txt);if(km)e.borderKm=+km[1];
   }catch(err){e.detailErr=true}
   out.c[v.countryCode]=e}
  if(!Object.keys(out.c).length)throw new Error('keine Daten');
  const changed=ids.filter(c=>out.c[c]&&old.c?.[c]&&JSON.stringify(out.c[c].flags)!==JSON.stringify(old.c[c].flags));
  S.sec=out;borderRefresh();save();if(changed.length)toast(`Sicherheitslage geändert: ${changed.map(c=>esc(country(c).name)).join(', ')}. Details unter Reise → Sicherheitslage.`,8000);
  if(UI.tab==='reise'&&!UI.pages.length)renderReise();
 }catch(e){S.secErr=e.message+' ('+new Date(Date.now()).toLocaleString('de-DE')+')';save()}
}
function secOf(p){
 const c=S.sec?.c?.[p.country];if(!c)return{lvl:'na',why:'Keine aktuellen Daten des Auswärtigen Amts geladen.'};
 const f=c.flags;const keys=[p.name,...(p.region||'').split(',')].map(s=>s.trim()).filter(s=>s.length>2);
 const hit=c.sent.filter(s=>keys.some(k=>s.toLowerCase().includes(k.toLowerCase())));
 let border=null;if((p.country==='KH'||p.country==='TH')&&c.sent.some(s=>/(Thailand|Kambodscha)/.test(s))&&c.borderKm){border=Math.round(distToLine(p,KH_TH_BORDER))}
 if(f.w)return{lvl:'rot',why:'Reisewarnung für das ganze Land.',sent:c.sent};
 if(border!=null&&border<=c.borderKm)return{lvl:'rot',why:`Liegt ca. ${border} km von der Grenze Thailand–Kambodscha, innerhalb der Warnzone (${c.borderKm} km).`,sent:c.sent};
 if(hit.length)return{lvl:'orange',why:'Ort oder Region wird in einem Warnhinweis genannt. Bitte den Text prüfen.',sent:hit};
 if(border!=null&&border<=c.borderKm+25)return{lvl:'orange',why:`Ca. ${border} km zur Grenze Thailand–Kambodscha, knapp außerhalb der Warnzone (${c.borderKm} km).`,sent:c.sent};
 if(f.pw||f.spw)return{lvl:'gelb',why:'Teilreisewarnung für andere Landesteile, dieser Ort wird nicht genannt.',sent:c.sent};
 if(f.sw)return{lvl:'gelb',why:'Sicherheitshinweis für das Land.',sent:c.sent};
 return{lvl:'gruen',why:'Keine Reise- oder Teilreisewarnung.',sent:[]};
}

function trAdvice(i){const st=S.stages[i];const pv=S.stages[i-1];const L=legsOf(st);if(!L.length)return [];
 const A=pv?byId(pv.placeId):{name:'Frankfurt (FRA)',lat:FRA_LL.lat,lon:FRA_LL.lon},B=byId(st.placeId);if(!A||!B)return [];const s=stagesDated()[i];const I=L.map((l,j)=>trInfo(s,null,j));
 const nm=m=>(MODES[m]||MODES.car)[1];const out=[];const booked=L.some(l=>l.status==='gebucht');const norm=x=>(x||'').toLowerCase().replace(/\s+/g,' ').trim();
 // A) Kette: Duplikate, Nulllängen, Sprünge
 const seen={};L.forEach((l,j)=>{const key=l.mode+'|'+norm(I[j].from)+'|'+norm(I[j].to);if(seen[key]!=null)out.push({lvl:'r',icn:'trash',t:`${trLabel(st,j)} ist doppelt (gleich wie ${trLabel(st,seen[key])}: ${nm(l.mode)} ${esc(I[j].from)} → ${esc(I[j].to)}).`,fix:`${trLabel(st,j)} löschen`,apply:()=>{L.splice(j,1);syncMode(st)}});else seen[key]=j});
 L.forEach((l,j)=>{if(I[j].km!=null&&I[j].km<1&&L.length>1&&!out.some(o=>o.fix===`${trLabel(st,j)} löschen`))out.push({lvl:'y',icn:'trash',t:`${trLabel(st,j)} hat keine Strecke (${esc(I[j].from)} → ${esc(I[j].to)}).`,fix:`${trLabel(st,j)} löschen`,apply:()=>{L.splice(j,1);syncMode(st)}})});
 // A2) Teilstrecke deckt die ganze Strecke ab, obwohl es weitere gibt -> überflüssig
 if(L.length>1){const S0=norm(I[0].from),E0=norm(I[L.length-1].to);const full=L.map((l,j)=>j).filter(j=>norm(I[j].from)===S0&&norm(I[j].to)===E0&&!out.some(o=>o.fix===`${trLabel(st,j)} löschen`));
  if(full.length&&full.length<L.length||full.length>1){const keep=full.find(j=>L[j].mode==='flight')??full[0];full.filter(j=>j!==keep||full.length<L.length&&L[j].mode!=='flight'&&I[j].km>1200).forEach(j=>{if(j===keep&&full.length===1)return;out.push({lvl:'r',icn:'trash',t:`${trLabel(st,j)} (${nm(L[j].mode)} ${esc(I[j].from)} → ${esc(I[j].to)}) deckt die ganze Strecke ab, obwohl es weitere Teilstrecken gibt.`,fix:`${trLabel(st,j)} löschen`,apply:()=>{L.splice(j,1);syncMode(st)}})})}}
 if(out.length)return out.filter((a,k,arr)=>arr.findIndex(b=>b.fix===a.fix)===k);
 for(let j=1;j<L.length;j++){if(out.some(o=>o.fix===`${trLabel(st,j)} löschen`))continue;if(norm(I[j].from)!==norm(I[j-1].to)){const prevTo=I[j-1].to,prevLL=L[j-1].toLL;if(norm(prevTo)===norm(I[j].to)){out.push({lvl:'r',icn:'trash',t:`${trLabel(st,j)} führt wieder nach ${esc(I[j].to)}, wo ${trLabel(st,j-1)} schon endet.`,fix:`${trLabel(st,j)} löschen`,apply:()=>{L.splice(j,1);syncMode(st)}});continue}out.push({lvl:'r',icn:'route',t:`Sprung in der Kette: ${trLabel(st,j-1)} endet in ${esc(prevTo)}, ${trLabel(st,j)} startet in ${esc(I[j].from)}.`,fix:`Start von ${trLabel(st,j)} auf ${prevTo} setzen`,apply:()=>{L[j].from=prevTo;if(prevLL)L[j].fromLL=prevLL;else delete L[j].fromLL}})}}

const SRCH_SORT=[['rel','Relevanz'],['mix','Ausgewogen'],['dist','Entfernung']];
function srchMode(){return S.settings.srchSort||'mix'}
function srchKm(km){return km==null?'':(km<10?String(Math.round(km*10)/10).replace('.',','):Math.round(km).toLocaleString('de-DE'))+' km'}

async function nomStay(q,c,cc){try{const v=c?[c.lon-.6,c.lat+.6,c.lon+.6,c.lat-.6]:null;const r=await nomSearch(q,v);return r.filter(x=>/hotel|hostel|guest_house|motel|apartment|resort|chalet|camp/.test(x.type||'')||x.category==='tourism').map(x=>{const parts=(x.display_name||'').split(',').map(s=>s.trim());return {name:x.name||parts[0],addr:parts.slice(1,4).join(', '),lat:+x.lat,lon:+x.lon,kind:x.type||'',cc:(x.address?.country_code||'').toUpperCase()}}).filter(x=>!cc||!x.cc||x.cc===cc)}catch(e){return []}}

// Google-Maps-Import (mehrere Links oder Takeout-Datei)
function gmImportSheet(){const G=UI.gmi=UI.gmi||{txt:'',res:null,role:'inbox'};
 let h=`<div class="h" style="font-size:18px;color:var(--tx2)">Aus Google Maps importieren</div><div class="t12 mu" style="margin:3px 0 12px;line-height:1.5">Links einfügen, einer pro Zeile (auch Kurzlinks maps.app.goo.gl). Oder eine Takeout-Datei wählen: „Gespeicherte Orte.json“ (GeoJSON) oder eine Listen-CSV.</div>
 <textarea class="fld" id="gmTxt" rows="5" placeholder="https://maps.app.goo.gl/…&#10;https://www.google.com/maps/place/…" style="width:100%;padding:10px;font-size:13px;line-height:1.45">${esc(G.txt)}</textarea>
 <div class="row wrap" style="gap:8px;margin:10px 0"><button class="btn sm pri" data-a="gmRun">${ic('search',14)} Links prüfen</button><label class="btn sm">${ic('ul',14)} Datei wählen<input type="file" id="gmFile" accept=".json,.geojson,.csv,application/json,text/csv" hidden></label></div>
 <div class="lab" style="margin:6px 0">Importieren als</div><div class="seg">${[['inbox','Idee'],['wei','Weitere'],['opt','Optional'],['fix','FIX']].map(([k,l])=>`<button data-a="gmRole" data-k="${k}" class="${G.role===k?'on':''}">${l}</button>`).join('')}</div><div id="tRes">`;
 const R=G.res;
 if(R==='load')h+=`<div class="empty"><span class="spin" style="display:inline-block"></span><div style="margin-top:6px">${esc(G.prog||'')}</div></div>`;
 else if(R&&R.length){const ok=R.filter(x=>!x.err);h+=`<div class="card" style="padding:0 12px">${R.map((x,i)=>x.err?`<div class="lrow">${ic('alert',16,'#d2b479')}<div class="sp" style="min-width:0"><div class="t13" style="color:#e3e4e5;word-break:break-all">${esc(x.src.slice(0,70))}</div><div class="t12" style="color:#d2b479">${esc(x.err)}</div></div></div>`:`<div class="lrow click" data-a="gmTog" data-i="${i}"><span class="ib" style="width:26px;height:26px;flex:none;border-radius:50%;${x.on?'background:var(--pet);color:var(--onpet)':''}">${x.on?ic('check',14):''}</span><div class="sp" style="min-width:0"><div class="t14 b" style="color:#e3e4e5">${esc(x.name)}</div><div class="t12 mu">${esc(country(x.country)?.name||'außerhalb der Reise')}${x.ex?' · bereits vorhanden: '+esc(x.ex.name):''}</div></div></div>`).join('')}</div>
  <div class="row sheetfoot" style="gap:8px"><button class="btn gh" data-a="closeSheet">Abbrechen</button><button class="btn pri sp" data-a="gmOk" ${ok.some(x=>x.on)?'':'disabled'}>${ic('check',16)} ${ok.filter(x=>x.on).length} übernehmen</button></div>`}
 h+=`</div>`;openSheet(h);UI.reSheet=gmImportSheet;
 const t=document.getElementById('gmTxt');if(t)t.oninput=e=>{G.txt=e.target.value};
 const f=document.getElementById('gmFile');if(f)f.onchange=e=>{const fl=e.target.files[0];if(fl)fl.text().then(tx=>gmFromFile(tx,fl.name))}}
function gmCountry(x){const cc=(x.cc||'').toUpperCase();if(cc&&S.countries.some(k=>k.id===cc))return cc;const as=assign({...x,role:'wei',cats:x.cats||['Sonstiges']});return as?as.a.country:(S.countries[0]?.id||'VN')}
async function gmRun(lines){const G=UI.gmi;G.res='load';gmImportSheet();const out=[];
 for(let k=0;k<lines.length;k++){const it=lines[k];G.prog=`Prüfe ${k+1} von ${lines.length} …`;if(!UI.partialOnly){UI.partialOnly=true;gmImportSheet();UI.partialOnly=false}
  try{const x=it.lat!=null?{name:it.name||'Ort',lat:it.lat,lon:it.lon,cats:['Sonstiges'],cc:it.cc||'',osm:'gm:'+it.lat.toFixed(5)+','+it.lon.toFixed(5),note:it.note||'',gmUrl:it.url||''}:{...(await gmResolve(it.url||it)),note:it.note||''};
   x.country=gmCountry(x);x.ex=findExisting(x);x.on=!x.ex;out.push(x)}catch(e){out.push({err:e.message,src:String(it.url||it.name||it)})}}
 G.res=out;gmImportSheet()}
function gmFromFile(tx,fn){let items=[];
 try{if(/\.csv$/i.test(fn)||!/^\s*[{[]/.test(tx)){const rows=parseCsv(tx.replace(/^﻿/,''));const hd=rows[0].map(x=>x.trim().toLowerCase());const iT=hd.findIndex(h=>/title|titel|name/.test(h)),iU=hd.findIndex(h=>/url|link/.test(h)),iN=hd.findIndex(h=>/note|notiz|comment/.test(h));
   items=rows.slice(1).map(r=>{const u=r[iU]||'';const p=gmParse(u);return {name:(r[iT]||p.name||'').trim(),url:u,note:iN>=0?r[iN]||'':'',lat:p.lat,lon:p.lon}}).filter(x=>x.name||x.url).map(x=>x.lat!=null?x:{url:x.url||x.name,note:x.note,name:x.name})}
  else{const j=JSON.parse(tx);const fs=j.features||(Array.isArray(j)?j:[]);items=fs.map(f=>{const pr=f.properties||{};const co=f.geometry?.coordinates||[];const loc=pr.location||{};const lat=co[1]??loc.latitude??null,lon=co[0]??loc.longitude??null;
   return {name:loc.name||pr.Title||pr.title||pr.name||'',url:pr.google_maps_url||pr['Google Maps URL']||'',lat:(lat&&lon)?+lat:null,lon:(lat&&lon)?+lon:null,cc:(loc.country_code||'').toUpperCase(),note:pr.Comment||pr.comment||''}}).filter(x=>x.lat!=null||x.url)}}
 catch(e){toast('Datei konnte nicht gelesen werden: '+esc(e.message));return}
 if(!items.length){toast('Keine Orte in der Datei gefunden.');return}gmRun(items)}

function srchKindNear(q,c){if(!c||c.lat==null)return [];q=(q||'').trim();const air=/^(flughafen|airport|flug|sân bay|san bay)$/i.test(q);const kinds=Object.keys(HUB_KW).filter(k=>HUB_KW[k].test(q+' ')&&q.split(/\s+/).length<=2);if(!air&&!kinds.length)return [];
 return srchNearHubs(c).filter(x=>air?x.code:kinds.includes(x.hub)).map(x=>({...x,type:x.type0,_ls:85}))}
function srchCut(a,n){const r=a.slice(0,n);r._q=a._q;r._c=a._c;return r}
function srchNearHubs(c){if(!c||c.lat==null)return [];const ap=AIRPORTS.map(([code,name,city,lat,lon,cc])=>({name:`${city} ${code} (${name})`,type:`Flughafen ${code}, ${city}`,lat,lon,cats:['Sonstiges'],osm:'iata:'+code,code,cc,region:city,_s:90,km:hav(c,{lat,lon})})).filter(x=>x.km<=200);
 const hb=HUBS.map(([name,kind,city,lat,lon,cc])=>({name,type:`${kind}, ${city}`,lat,lon,cats:['Sonstiges'],osm:'hub:'+norm(name),cc,region:city,hub:kind,km:hav(c,{lat,lon})})).filter(x=>x.km<=80);
 return srchRank(ap.concat(hb).sort((a,b)=>a.km-b.km).slice(0,14),'',c)}

const GPL_LS='auszeit27_gkey',GPL_RATE='auszeit27_grate',GPL_USE='auszeit27_guse';
function gplKey(){try{return localStorage.getItem(GPL_LS)||''}catch(e){return ''}}
function gplRate(){try{return localStorage.getItem(GPL_RATE)==='1'}catch(e){return false}}
function gplUse(){try{const u=JSON.parse(localStorage.getItem(GPL_USE)||'{}');const d=iso(new Date());const m=d.slice(0,7);return {day:u.d===d?u.n:0,month:u.m===m?u.mn:0}}catch(e){return {day:0,month:0}}}
function gplCount(){try{const u=JSON.parse(localStorage.getItem(GPL_USE)||'{}');const d=iso(new Date()),m=d.slice(0,7);const o={d,n:(u.d===d?u.n:0)+1,m,mn:(u.m===m?u.mn:0)+1};localStorage.setItem(GPL_USE,JSON.stringify(o))}catch(e){}}
const GPL_CACHE=new Map();let GPL_TOK=0;
function gplCats(t){t=t||[];const c=new Set();if(t.some(x=>/museum|temple|church|mosque|place_of_worship|historical|monument|cultural|art_gallery|tourist_attraction/.test(x)))c.add('Kultur');if(t.some(x=>/park|natural_feature|hiking|national_park|garden|waterfall|mountain/.test(x)))c.add('Natur');if(t.includes('beach'))c.add('Strand');if(t.some(x=>/restaurant|cafe|food|bar|bakery/.test(x)))c.add('Food');if(t.some(x=>/market|shopping|city_hall|neighborhood|locality/.test(x)))c.add('Stadt');return c.size?[...c]:['Sonstiges']}

function tripCC(){return new Set(S.countries.map(c=>c.id))}
function tripBox(m=1.5){let la=[],lo=[];S.countries.forEach(c=>{const b=COUNTRY_BOX[c.id];if(b){la.push(b[0],b[2]);lo.push(b[1],b[3])}});S.stages.forEach(st=>{const p=byId(st.placeId);if(p&&p.lat!=null){la.push(p.lat);lo.push(p.lon)}});if(!la.length)return null;
 return {low:{latitude:Math.max(-89,Math.min(...la)-m),longitude:Math.max(-179,Math.min(...lo)-m)},high:{latitude:Math.min(89,Math.max(...la)+m),longitude:Math.min(179,Math.max(...lo)+m)}}}
function tripCenter(){const b=tripBox(0);return b?{lat:(b.low.latitude+b.high.latitude)/2,lon:(b.low.longitude+b.high.longitude)/2}:null}
function inTrip(x){const cc=(x.cc||'').toUpperCase();if(cc)return tripCC().has(cc);if(x.lat==null)return null;return S.countries.some(c=>{const b=COUNTRY_BOX[c.id];return b&&x.lat>=b[0]&&x.lat<=b[2]&&x.lon>=b[1]&&x.lon<=b[3]})||null}
function tripNearKm(x){let bd=1e9;S.stages.forEach(st=>{const p=byId(st.placeId);if(p&&x.lat!=null){const d=hav(p,x);if(d<bd)bd=d}});return bd}
async function gplFind(q,c,opt={}){const key=gplKey();q=(q||'').trim();if(!key||q.length<3)return [];
 const ck=q.toLowerCase()+'|'+(opt.type||'')+'|'+(opt.strict?'S':'')+'|'+(c?c.lat.toFixed(1)+','+c.lon.toFixed(1):'');if(GPL_CACHE.has(ck))return GPL_CACHE.get(ck);
 if(!opt.now){const tok=++GPL_TOK;await new Promise(r=>setTimeout(r,450));if(tok!==GPL_TOK)return []}

 document.addEventListener('pointermove',e=>{if(!el)return;const mx=e.clientX-x0,my=e.clientY-y0;if(!drag){if(Math.abs(mx)>10&&Math.abs(mx)>Math.abs(my)*1.3){drag=true;el.style.transition='none';el.parentNode.classList.add('sw')}else if(Math.abs(my)>10){el=null;return}else return}dx=mx;el.style.transform=`translateX(${Math.max(-W-20,Math.min(0,base+dx))}px)`},{passive:true});
 const end=()=>{if(!el)return;el.style.transition='';if(drag){const pos=base+dx;if(pos<-W/2){el.style.transform=`translateX(-${W}px)`;el.setAttribute('data-open','');if(!S.swipeHint){S.swipeHint=true;save()}}else{el.style.transform='';el.removeAttribute('data-open');const g=el;setTimeout(()=>g.parentNode&&g.parentNode.classList.remove('sw'),200)}const f=el;f.dataset.justDragged='1';setTimeout(()=>{delete f.dataset.justDragged},60)}el=null};
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
 document.addEventListener('click',e=>{const f=e.target.closest('.swp .fg');if(f&&(f.dataset.justDragged||f.hasAttribute('data-open'))){e.stopPropagation();e.preventDefault();if(!f.dataset.justDragged){f.style.transform='';f.removeAttribute('data-open');setTimeout(()=>f.parentNode&&f.parentNode.classList.remove('sw'),200)}}},true);
})();

function layerOn(p){const L2=S.settings.layers||{};const k=p.role==='anchor'?'anc':excNo(p)?'exc':'idea';return L2[k]!==false}
function updPeek(){let el=document.getElementById('mapPeek');const host=document.getElementById('v-karte');if(!host)return;if(!el){el=document.createElement('div');el.id='mapPeek';host.appendChild(el)}
 const l=UI.mapList||[];let vis=l;try{if(MAP&&MAP.getBounds){const b=MAP.getBounds();if(b&&b.contains)vis=l.filter(p=>b.contains([p.lat,p.lon]))}}catch(e){}
 UI.mapVis=vis;const a=vis.filter(p=>p.role==='anchor').length,e=vis.filter(p=>p.role!=='anchor'&&excNo(p)).length,i=vis.length-a-e;
 el.innerHTML=`<div class="grab" style="margin:6px auto 8px"></div><div class="row click" data-a="peekList"><div class="sp"><div class="t14 b" style="color:#e3e4e5">Im Ausschnitt: ${vis.length} ${vis.length===1?'Ort':'Orte'}</div><div class="t12 mu">${[a?a+' Etappen':'',e?e+' Ausflüge':'',i?i+' Ideen':''].filter(Boolean).join(', ')||'Karte verschieben oder zoomen'}</div></div><span class="t12 b" style="color:#a9d6cf;display:flex;gap:3px;align-items:center">Liste ${ic('up',12,'#a9d6cf')}</span></div>`;
 if(MAP&&!MAP._peekOn&&MAP.on){MAP._peekOn=1;MAP.on('moveend',updPeek)}}
function peekSheet(){const vis=(UI.mapVis||[]).slice().sort((a,b)=>(routeNo(a)||'999').localeCompare(routeNo(b)||'999',undefined,{numeric:true}));
 openSheet(`<div class="h" style="font-size:18px;color:var(--tx2)">Im Ausschnitt</div><div class="t12 mu" style="margin:3px 0 12px">${vis.length} Orte</div><div class="card" style="padding:0 12px">${vis.map(p=>{const no=routeNo(p);return `<div class="lrow click" data-a="mapPick" data-id="${p.id}">${no?`<span class="tn" style="min-width:34px;height:22px;font-size:11px;background:#2c2f33;color:#c4c7ca">${no}</span>`:''}<div class="sp"><div class="t14 b" style="color:#e3e4e5">${esc(p.name)}</div><div class="t12 mu">${esc(routeInfo(p))}</div></div>${ic('chev',14,'#6f7378')}</div>`}).join('')||'<div class="t12 mu" style="padding:12px 0">Keine Orte im Ausschnitt.</div>'}</div>`)}
function mapPlaceSheet(p){const no=routeNo(p);const isA=p.role==='anchor';const k=isA?(prioOf(p)||'anc'):p.role==='inbox'?'wei':p.role;const sm=sumOf(p);const st=isA?stagesDated().find(x=>x.placeId===p.id):null;const i=isA?S.stages.findIndex(x=>x.placeId===p.id):-1;const t=!isA?dayTravel(p):null;
 const chips=[];if(isA){chips.push(excursions(p.id).length+' Ausflüge');const h=S.stages[i]?.stay;chips.push(h&&h.name?'Unterkunft '+(h.status==='gebucht'?'gebucht':'offen'):'Unterkunft offen');const c=stageCost(i);if(c.c||c.budget)chips.push(eur(c.c)+(c.budget?' von '+eur(c.budget):''))}
 else{if(p.planned)chips.push(fmtDL(new Date(p.planned+'T12:00:00')).slice(0,9));if(t)chips.push((t.src==='Schätzung'?'ca. ':'')+fmtMin(t.min)+' ab '+t.a.name);if(p.tt)chips.push((TOUR_MODES[p.tt.mode]||TOUR_MODES.car)[1]+', '+(p.tt.status==='gebucht'?'gebucht':'offen'))}
 if(wCount(p))chips.push('W '+wCount(p)+' Sprachen');if(p.gRating)chips.push('★ '+String(p.gRating).replace('.',',')+' Google');
 if(!sm)setTimeout(()=>loadWiki(p),20);
 openSheet(`<div class="row" style="gap:10px">${no?`<span class="kno" style="background:${isA?`var(--c-${k})`:`color-mix(in srgb,var(--c-${k}) 30%,#26282b)`};color:${isA&&k==='anc'?'#1c1d1f':'#fff'}">${no}</span>`:''}<div class="sp"><div class="h" style="font-size:17px;color:var(--tx2)">${esc(p.name)}</div><div class="t12 mu">${esc(routeInfo(p))}</div></div>${prioChip(p).replace('class="tag"','class="chipe"').replace('height:22px;font-size:10.5px;','')}</div>
 ${sm?`<p class="d" style="margin:10px 0;font-size:13px">${esc(sm.text)}</p>`:''}
 ${chips.length?`<div class="row wrap" style="gap:6px;margin:8px 0 10px">${chips.map(c=>`<span class="chip sm">${esc(c)}</span>`).join('')}</div>`:''}
 <div class="row" style="gap:8px"><button class="btn gh sp" data-a="place" data-id="${p.id}">${ic('layers',15)} Details</button>${(isA||no)?`<button class="btn gh sp" data-a="goRouteC" data-k="${p.country}">${ic('route',15)} In Route</button>`:`<button class="btn gh sp" data-a="umh" data-id="${p.id}" data-m="replace">${ic('link',15)} Zuordnen</button>`}<a class="btn gh sp" href="${mapsUrl(p)}" target="_blank" rel="noopener">${ic('pin',15)} Maps</a></div>`)}
function mapsUrl(x){const o=debugTarget()||S.lastPos;const dst=x.lat!=null?`${x.lat},${x.lon}`:encodeURIComponent(x.name);return o?`https://www.google.com/maps/dir/?api=1&origin=${o.lat},${o.lon}&destination=${dst}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.name+(x.region?' '+x.region:''))}${x.lat!=null?'':''}`}

function viewSheet(){const L2=S.settings.layers||{};const ML=S.settings.mapLabels||{};const row=(g,k,icn,l,sub,on)=>`<div class="lrow click" data-a="viewTog" data-g="${g}" data-k="${k}">${ic(icn,17,'#a9adb1')}<div class="sp"><div class="t14 b" style="color:#e3e4e5">${l}</div>${sub?`<div class="t12 mu">${sub}</div>`:''}</div><span class="ib" style="width:26px;height:26px;border-radius:7px;${on?'background:var(--pet);color:var(--onpet)':'background:transparent;border:1.5px solid #8c9196'}">${on?ic('check',14):''}</span></div>`;
 openSheet(`<div class="h" style="font-size:18px;color:var(--tx2)">Ansicht der Karte</div><div class="t12 mu" style="margin:3px 0 12px">Mehrfachauswahl, der Kartenausschnitt bleibt erhalten.</div>
 <div class="lab" style="margin-bottom:6px">Ebenen</div><div class="card" style="padding:0 12px">${row('lay','anc','bed','Etappen','mit Nummer',L2.anc!==false)}${row('lay','exc','route','Ausflüge','mit Nummer, z. B. 1.2',L2.exc!==false)}${row('lay','idea','pin','Ideen','noch keiner Etappe zugeordnet',L2.idea!==false)}${row('tr','tr','plane','Transfers','Linien zwischen den Etappen',S.settings.showTr!==false)}</div>
 <div class="lab" style="margin:12px 0 6px">Kennzahlen am Punkt</div><div class="card" style="padding:0 12px">${row('lab','g','star','Google-Bewertung','★ 4,6, sofern eingetragen',!!ML.g)}${row('lab','w','spark','Wikipedia-Einträge','W 84 = Artikel in 84 Sprachen, ein Maß für Bekanntheit',!!ML.w)}</div>
 <div class="lab" style="margin:12px 0 6px">Farben</div><div class="row wrap" style="gap:6px">${[['anc','Etappe'],['fix','FIX'],['opt','Optional'],['wei','Weitere']].map(([k,l])=>`<span class="chip sm"><span class="mk ${k}" style="width:10px;height:10px;border-width:1px"></span>${l}</span>`).join('')}</div>
 <div class="row sheetfoot"><button class="btn pri sp" data-a="closeSheet">Fertig</button></div>`)}

function mapLab(ll,txt,col,strong){if(!ll||!txt)return;try{const m=L.marker(ll,{icon:L.divIcon({className:'',html:`<div class="mlab${strong?' s':''}" style="border-color:${col||'#3d6a6c'}">${esc(txt)}</div>`,iconSize:[0,0],iconAnchor:[-8,10]}),interactive:false});m.addTo(LAY)}catch(e){}}

function tourMark(x,hl){try{const col=tourCol(x.tt.mode);const M=TOUR_MODES[x.tt.mode]||TOUR_MODES.car;const mid=[(hl.lat+x.lat)/2,(hl.lon+x.lon)/2];const no=excNo(x);
 const mk=L.marker(mid,{icon:L.divIcon({className:'',html:`<div style="position:relative;width:30px;height:30px"><div style="position:absolute;left:4px;top:6px;width:22px;height:22px;border-radius:6px;background:${col};display:flex;align-items:center;justify-content:center;border:2px solid #141617">${ic(M[0],12,'#141617',2.2)}</div>${no?`<div style="position:absolute;left:-6px;top:-4px;white-space:nowrap;font:bold 9.5px Poppins,sans-serif;color:${col};background:#1e2526;border:1px solid ${col};border-radius:5px;padding:0 3px;line-height:14px">${no}</div>`:''}</div>`,iconSize:[30,30],iconAnchor:[15,17]}),zIndexOffset:120}).addTo(LAY);
 if(mk.on)mk.on('click',ev=>{if(L.DomEvent)L.DomEvent.stopPropagation(ev);UI.ttDraft=null;ttSheet(x.id)})}catch(e){}}
