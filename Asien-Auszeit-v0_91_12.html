<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

const AI_CHAT_SYS=`Du bist der Reiseassistent in der privaten Planungs-App „Asien-Auszeit 2027“ von zwei Reisenden aus Deutschland. Antworte auf Deutsch, knapp und konkret, mit Bezug auf die Etappen (E1, E2 …) und Daten aus dem Reiseplan. Nutze kurze Absätze oder Aufzählungen mit „- “, **fett** sparsam. Einreise-Checklisten, Visa-Angaben und Fristen stehen im Reiseplan – nutze sie. Wenn eine Websuche verfügbar ist: Bei Fragen zu Einreise- und Visaregeln, Fahrplänen, Öffnungszeiten oder aktuellen Preisen IMMER zuerst suchen (bei Einreise bevorzugt auswaertiges-amt.de oder offizielle Regierungsseiten), höchstens 2 Suchen, und die Quelle kurz nennen. Für Fragen, die der Reiseplan beantwortet, nicht suchen. Ohne Websuche: sagen, dass solche Regeln vor der Reise zu prüfen sind. Erfinde keine Buchungen. Budgetwerte rechnet die App selbst.

const AI_CHK_SYS=`Du prüfst den Reiseplan einer privaten Reise-App auf Fehler, Risiken und Verbesserungen. Antworte NUR mit gültigem JSON, ohne Kommentare und ohne Text davor oder danach, in genau dieser Form:

const AI_PR_SYS=`Du ermittelst Richtpreise für einen Transport in Südostasien/Südasien für eine Reise-App. Rufe zuerst die angegebene 12Go-Seite ab (falls ein Web-Werkzeug verfügbar ist) und lies Fahrplan, Anbieter und Preise. Ist die Seite nicht lesbar oder die Strecke dort nicht vorhanden, nutze die Websuche falls verfügbar (Bookaway, Baolau, Betreiber- und Bahnseiten). Echte Preise haben Vorrang; dein Wissen bzw. eine Schätzung nur, wenn keine Quelle einen Preis zeigt.

async function aiPrice(i,j){const c=trCities(i,j);const url=`https://12go.asia/en/travel/${trSlug(c.from)}/${trSlug(c.to)}`;const M={flight:'Flug',bus:'Bus/Zug/Limousine',boat:'Boot/Fähre',car:'Privatfahrer oder Taxi'}[c.mode]||'Bus';

  catch(e){last=e;if(k==='fetch'&&aiWsIsToolErr(e.message)){try{localStorage.setItem('auszeit27_aweb','search')}catch(x){}continue}break}}
 throw last||new Error('kein Preis gefunden')}

 {v:'0.91_02',d:'26.11.2026',items:['Neu unter Geld: Kostenanalyse (KI) – ganze Reise oder je Land in drei Stufen: Low Budget, Ausgewogen, Oberes Segment','Vorher fragt die App die Annahmen ab: Höchstpreis pro Nacht je Stufe (der höchste Wert ist die absolute Obergrenze – teurer wird es nie) und Puffer','Gebuchtes zählt mit dem echten Betrag, geplante Beträge gelten für „Ausgewogen“, alles Offene schätzt Claude mit Websuche; die App rechnet hoch','Spielraum gesamt und pro Tag, Vergleich der drei Stufen, Zusammensetzung nach Unterkunft, Transport, Ausflügen und Tagesausgaben, Verlauf über die Reise mit Budget, wann bezahlt wird, Spielraum pro Tag je Land, alle Posten je Land (antippen öffnet das Formular)','Info-Knopf erklärt Schritt für Schritt, wie gerechnet wird']},
 {v:'0.91_01',d:'26.11.2026',items:['Neue Arbeitsversion auf Basis der Vollversion 0.91 (inhaltlich identisch)']},
 {v:'0.91',d:'26.11.2026',items:['Vollversion 0.91 – dauerhaft gesichert unter releases/Asien-Auszeit-v0_91.html. Neu seit 0.90:','Verbindungen je Transfer mit echten Angeboten (12Go, Skyscanner): stabile Preise aus den günstigsten passenden Angeboten, Übernahme füllt den ganzen Transfer','Unterkunft finden (KI) mit Preisen je Portal, Gesamtkosten, Ausstattung und Zahlungsarten; Ausflüge finden (KI) mit Bewertungen; KI-Vorschläge auswählen und übernehmen, KI-Kennzeichnung überall','Einreise-Karten vor jedem Landeswechsel, Checklisten mit KI aktuell gehalten, Erinnerung beim Start, Kalender-Export','Abgleich zwischen euren Handys über ein privates, auf dem Gerät verschlüsseltes GitHub-Repository – inklusive geteilter Buchungsbestätigungen','Reisehinweise (KI) zu Streiks, Wetter und Ausfällen; Wetter mit Details und markiertem Aufenthalt; Fahrzeiten live; Sicherheitslage des Auswärtigen Amts; Google-Maps-Import; Testmodus','Karte ohne Schlüssel, Bewertungen automatisch über Claude']},
 {v:'0.90_27',d:'26.11.2026',items:['Route: Wetter als eigene Zeile mit Trennlinie in der Etappenkarte (wie Unterkunft und Ausflüge) – Spanne, Pfeil, antippen für die Details']},
 {v:'0.90_26',d:'26.11.2026',items:['Wetter schlanker: in der Route und auf der Etappenseite nur noch die Spanne (Höchst- / Tiefstwerte) mit Pfeil','Antippen öffnet die Wetter-Details; der Aufenthalt der Etappe ist im 14-Tage-Verlauf als Band mit Ortsnamen markiert']},
 {v:'0.90_25',d:'26.11.2026',items:['Heute: Wetter antippen öffnet die Details – jetzt (gefühlt, Wind, Luftfeuchte, UV, Sonnenauf- und -untergang), stündlich für 24 Stunden und 14 Tage als Verlauf mit Höchst- und Tiefstwerten und Regen; Tag antippen zeigt die Werte; auch die Wetterkarte auf der Etappenseite öffnet die Details','Route: Wetter an der aktuellen Etappe als kleine Tagesleiste (Tag, Symbol, Höchst- und Tiefstwert, Regentage markiert)','Ausflüge: Fahrzeit als kompakte Angabe in derselben Zeile statt verrutschter Trennpunkte','Reisehinweise auf Heute und in der Übersicht mit x schließen – bis zum nächsten Start; in der Route und auf den Etappen bleiben sie sichtbar']},
 {v:'0.90_24',d:'26.11.2026',items:['Wetter im Testmodus behoben: Die Vorhersage reicht nur 16 Tage ab dem echten Datum – für simulierte Tage zeigt die App jetzt die gleichen Tage im Vorjahr; lässt sich das Wetter nicht laden, steht ein Hinweis statt einer leeren Stelle','Heute: Fahrzeit von der Unterkunft zu geplanten Ausflügen im Tagesablauf und bei „Als Nächstes“','Heute: höchstens drei Reisehinweise (wichtigste zuerst), alle weiteren über „Alle … Hinweise ansehen“']},
 {v:'0.90_23',d:'26.11.2026',items:['Route: Warndreiecke lassen sich antippen und öffnen den Hinweis mit Quelle und „Zum Transfer“ – am Transfer und neben dem Etappennamen (Hinweise zum Aufenthaltsort)','Hinweise auf jeder Ebene: auf der Etappenseite (alle Hinweise der Etappe), im Transfer-Formular, im Unterkunfts-Formular, auf der Einreise-Karte und in der Checkliste des Landes (Sicherheitslage)','Route: an der aktuellen bzw. nächsten Etappe eine Wetterzeile (Temperatur, Regentage)']},
 {v:'0.90_22',d:'26.11.2026',items:['Einstellungen → Testmodus: Datum simulieren (frei wählbar oder Reisebeginn, Tag 5, Tag 20, letzter Tag) und Standort simulieren (Land oder Etappe) – zum Ausprobieren, wie die App unterwegs aussieht','Solange der Testmodus läuft, steht oben eine Leiste mit Datum und Ort und „Beenden“','Der simulierte Standort gilt für „Mein Standort“ auf der Karte; Datum und Standort bleiben auf dem jeweiligen Gerät']},
 {v:'0.90_21',d:'26.11.2026',items:['Neu: Reisehinweise – die KI prüft vor den Transfers der nächsten Tage und am aktuellen Ort Streiks, Unwetter, Ausfälle und Schließungen (beim Start höchstens zweimal täglich, am Tag vor einem Transfer alle 6 Stunden); Warnungen in der Erinnerung beim Start, auf „Heute“, in der Übersicht und als Symbol am Transfer in der Route','Wetter: auf jeder Etappe die Vorhersage (bis 15 Tage voraus), für spätere Etappen die gleichen Tage im Vorjahr als Anhaltspunkt; auf „Heute“ das Wetter von heute und morgen','Fahrzeiten live: von der Unterkunft zu jedem Ausflug über das Straßennetz (OpenStreetMap), kurze Strecken auch zu Fuß; ohne Netz als Schätzung mit „ca.“','Sicherheitslage des Auswärtigen Amts: auf jeder Einreise-Karte, mit Details in der Checkliste des Landes und als Warnung auf Etappen in Warngebieten (z. B. Grenze Thailand–Kambodscha); Änderungen werden gemeldet','Orte: „Aus Google Maps importieren“ – Links (auch Kurzlinks) oder eine Takeout-Datei der Listen (CSV oder „Gespeicherte Orte.json“), doppelte Orte werden erkannt, Import als Ideen','Abgleich: ein Test-Datum (Debug) bleibt auf dem jeweiligen Gerät','Begriffe: „Richtpreis“ heißt überall „Verbindungen vergleichen“']},
 {v:'0.90_20',d:'26.11.2026',items:['Neu: Abgleich zwischen euren Handys (Einstellungen → Abgleich) über ein privates GitHub-Repository – auf dem Handy verschlüsselt (AES-256) mit gemeinsamem Passwort oder PIN, auf Wunsch auf dem Gerät gemerkt','Abgeglichen werden Reise, Ausgaben, Checklisten, Einstellungen, KI-Verlauf und die per Teilen eingelesenen Buchungsbestätigungen samt Original-PDF oder Screenshot','Gleicht beim Start, beim Zurückkehren in die App und 15 Sekunden nach jeder Änderung ab; nie während ein Formular offen ist','Gleichzeitige Änderungen werden pro Etappe, Ort und Ausgabe zusammengeführt; wurde dasselbe Feld auf beiden Handys geändert, gilt die neuere Änderung','Zweites Handy: Stand von GitHub übernehmen (bisheriger Stand bleibt als Sicherung) oder zusammenführen','Nur private Repositories; Token und Passwort bleiben auf dem Gerät und sind nie im Export']},
 {v:'0.90_19',d:'26.11.2026',items:['Route: vor jedem Landeswechsel eine Karte „Einreise …“ mit Checkliste, Visum, nächster Frist und KI-Prüfstand – antippen öffnet die Checkliste des Landes','Einreise-Checklisten: Die KI prüft im Hintergrund alle 14 Tage die aktuellen Bestimmungen (Auswärtiges Amt, offizielle Portale) für Länder mit Einreise in den nächsten 6 Monaten; geänderte, neue und entfallene Punkte sind markiert, „Aktualisieren“ in der Checkliste','Erinnerung beim Start: fällige Punkte der nächsten Tage (Standard 7) mit „nicht mehr erinnern“; Tage und Ein/Aus unter Einstellungen → Erinnerungen','Neu: „In den Kalender“ (Einstellungen → Daten) – Unterkünfte, Transfers, Ausflüge und Fristen als .ics mit Erinnerungen','Ausflüge: ein KI-Weg „Ausflüge finden“ – auch im nächsten Schritt der Etappe; der Tagesplan für einen einzelnen freien Tag bleibt im KI-Chat','Unterkunft: im nächsten Schritt der Etappe direkt „Vorschläge (KI)“','Aufgeräumt: alter Richtpreis-Kasten entfällt (Verbindungen ersetzt ihn), „Anreise“ heißt überall „Transport“']},
 {v:'0.90_18',d:'26.11.2026',items:['Neu: „Ausflüge finden (KI)“ im Schritt Ausflüge – wie bei Unterkunft und Verbindungen: Interessen, Dauer, Unterwegs, Budget und Mindestbewertung wählen (letzte Einstellungen vorausgewählt), Vorschläge mit Google-Bewertung, Preis für zwei, Dauer, Weg und Vorschlagstag, mehrere antippen, Tag je Ausflug in der Rückfrage ändern','Ist eine andere Karte ausgewählt, hat die KI-Empfehlung nur noch einen leichten Rahmen','„Geschätzt“ wird direkt an der Karte erklärt; bei geschätzten Hotelpreisen heißt der Knopf „Echten Preis holen“']},
 {v:'0.90_17',d:'26.11.2026',items:['Unterkunft finden: Gesamtkosten für den ganzen Zeitraum groß auf jeder Karte, bei jedem Portalpreis (pro Nacht = gesamt), in der Auswahl-Leiste und in der Rückfrage','Beim Preisrahmen pro Nacht rechnet die App den Gesamtrahmen für die Nächte der Etappe gleich mit']},
 {v:'0.90_16',d:'26.11.2026',items:['Eingaben in allen Formularen hell und kräftig wie der Preis; leere Felder und Platzhalter blass; Datums- und Zeitfelder passen sich dem dunklen Design an','KI-Vorschläge lassen sich antippen: Auswahl mit grünem Rahmen, dann „Auswahl übernehmen“ – im KI-Chat, in der Reise-Prüfung, bei Verbindungen und Unterkünften (Leiste unten)','Ausflugsvorschläge der KI zeigen die Google-Bewertung schon vor dem Übernehmen; sie wird mit übernommen','Alles, was die KI angelegt hat (Transfers, Unterkünfte, Ausflüge, Checklisten-Punkte), trägt ein KI-Kennzeichen; KI-Preise erscheinen bei den Kosten lila als „KI-Schätzung“','Eigener Betrag ersetzt die KI-Schätzung','Behoben: Die Rückgängig-Meldung fing nach dem Ausblenden noch Tipper ab']},
 {v:'0.90_15',d:'26.11.2026',items:['Unterkunft finden: Die letzten Einstellungen (Preisrahmen, Ausstattung, Zahlung, Art, Bewertung) sind immer vorausgewählt – auch bei anderen Etappen und auch ohne neue Suche gespeichert. „Sonstiges“ gilt nur für die Etappe','Preisvergleich je Portal: Booking, Agoda, Expedia, Hotels.com, Trip.com, Trivago – günstigster Preis als Richtpreis','Zahlungsarten je Unterkunft (Amex, Visa, Mastercard …) und Filter „Zahlung möglich mit“','„Preise & Zahlung prüfen“ holt für ein Hotel die Preise für eure Reisedaten und die akzeptierten Karten','Booking-, Agoda-, Expedia- und Trip.com-Links führen direkt zur Hotelseite mit Reisedaten, 2 Personen und Euro, damit die Portale gleich Preise zeigen; der Booking-Link wird als Buchungslink übernommen']},
 {v:'0.90_14',d:'26.11.2026',items:['Unterkunft finden (KI): erst Preis pro Nacht, Ausstattung, Art und Mindestbewertung wählen – Claude sucht auf Booking.com, Agoda, Trip.com, Hotels.com und Trivago und zeigt Preis pro Nacht, Gesamtpreis, Bewertung, erfüllte und fehlende Wünsche','Übernehmen trägt Name, Lage, Gesamtpreis und Ausstattung ein – mit Rückfrage „schon gebucht/bezahlt?“ (Standard: nein) und Warnung, wenn eine gebuchte Unterkunft ersetzt würde','Flüge: Claude nutzt Skyscanner-Routenseiten; Flug-Optionen und Flug-Teilstrecken haben Links zu Skyscanner und Google Flights mit Datum und 2 Personen','Neue Unterkünfte und offene Transfers stehen jetzt auf „offen“ und „nicht bezahlt“']},
 {v:'0.90_13',d:'26.11.2026',items:['Transport fehlt nie: Werden alle Teilstrecken gelöscht, steht automatisch ein offener Transfer zwischen den Etappen als Aufgabe da','„Verbindungen“ gibt es in jedem Transfer – auch gebucht, auch im offenen Platzhalter und im Schritt Transport','Verbindungen sucht immer die ganze Strecke von Etappe zu Etappe. Übernehmen ersetzt alle Teilstrecken und füllt Verkehrsmittel, Datum, Abfahrt, Ankunft, Dauer, Anbieter, Orte, Kosten und Notiz','Vor dem Übernehmen fragt die App: schon gebucht? schon bezahlt? (Standard: nein) und warnt, wenn gebuchte Teilstrecken ersetzt würden','Nächster Schritt nennt jetzt „Transport offen“ bzw. „Kosten für T0.1, T0.2“; der Schritt „Anreise“ heißt „Transport“']},
 {v:'0.90_12',d:'26.11.2026',items:['Verbindungen: Claude schreibt die echten Angebote ab (z. B. Zeilen der 12Go-Fahrplantabelle mit Anbieter, Fahrzeug, Abfahrt, Preis, Bewertung) – für alle Verkehrsmittel','Den Richtpreis berechnet die App selbst: Mittel der drei günstigsten passenden Angebote, Privatfahrer ab 3 Plätzen. Gleiche Angebote ergeben immer denselben Preis','Jede Option zeigt „Echte Angebote“ oder „Geschätzt“; die Angebote lassen sich aufklappen','Findet Claude unter der 12Go-Adresse nichts, sucht es die passende Seite (12Go, Rome2Rio, Bookaway, Baolau) per Websuche und liest sie']},
 {v:'0.90_11',d:'26.11.2026',items:['Stabilere Transferpreise: Privatfahrer zählen immer je Fahrzeug – die App rechnet den Gesamtpreis für zwei selbst, statt ihn Claude zu überlassen','Claude nennt Preise in der Währung der Quelle mit Fahrzeugtyp und Herkunft; die App rechnet in Euro um','Neu suchen nimmt die früheren Preise als Ausgangswert. Weicht ein Preis um mehr als 30 % ab, steht der frühere Wert an der Option, mit „Mit ≈ … übernehmen“','KI-Prüfung und Chat verwenden die Transferpreise aus der App, statt neu zu schätzen']},
 {v:'0.90_10',d:'26.11.2026',items:['Fehler behoben: Verbindungen-Suche brach mit „temperature is deprecated“ ab (das aktuelle Claude-Modell nimmt diese Einstellung nicht mehr an)']},
 {v:'0.90_09',d:'26.11.2026',items:['Neue Seite „Verbindungen“ je Transfer: Claude vergleicht alle Verkehrsmittel und Kombinationen mit Umstieg (Preis für zwei, Dauer, Umstiege, Anbieter)','Auswahl nach Ausgewogen, Schnellste oder Günstigste; Markierungen „Empfehlung“, „Schnellste“, „Günstigste“ mit Begründung','Übernehmen legt alles im Transfer ab (Verkehrsmittel, Preis, Dauer, Anbieter, Abfahrt) – Verbindungen mit Umstieg als mehrere Teilstrecken, mit Rückgängig','Ergebnis bleibt je Transfer gespeichert, bis „Neu suchen“ getippt wird','KI-Aufgabe „Verbindungen“ vergleicht alle offenen Transfers eines Landes']},
 {v:'0.90_08',d:'26.11.2026',items:['Richtpreis folgt sofort dem im Formular gewählten Verkehrsmittel (auch vor dem Speichern); „Neu suchen“ sucht für dieses Verkehrsmittel','Fehlt ein Angebot für das gewählte Verkehrsmittel, steht das da – mit „Für … suchen“','Claude nennt je Strecke alle realistischen Verkehrsmittel als eigene Optionen; ist die 12Go-Seite nicht lesbar, sucht Claude zusätzlich im Netz','Reine Schätzungen sind als „Schätzung ohne Live-Angebote“ gekennzeichnet','„Als Kosten übernehmen“ übernimmt das gewählte Verkehrsmittel mit']},
 {v:'0.90_07',d:'26.11.2026',items:['Richtpreis: Claude liefert je Strecke bis zu vier Verbindungen, jede mit passendem Verkehrsmittel, Preis, Dauer und Anbieter; angezeigt wird immer der Preis für das gewählte Verkehrsmittel','„Bessere Verbindung“ mit Begründung und Umstellen auf einen Tipp (mit Rückgängig); weitere Optionen zum Wählen','Verkehrsmittel Zug ergänzt','Reise prüfen achtet besonders auf Transfers und kann das Verkehrsmittel direkt umstellen; auch im Gespräch möglich']},
 {v:'0.90_06',d:'26.11.2026',items:['„Alle“ bzw. „Alle Länder“ steht in den Auswahlleisten immer vorn','Karte: Ausflüge mit Nummer und Namen, Ideen mit Ortsnummer und Namen (Namen ab mittlerer Zoomstufe)','Karte: Unterkünfte mit Etappennummer, mehrere am selben Ort zusammengefasst, fehlende Position gestrichelt mit „?“','Karte: Ausschnitt bleibt nach dem Bearbeiten erhalten; Knöpfe für „Ausschnitt zurücksetzen“ und „Mein Standort“','Transfers zeigen beim Antippen oder Überfahren Nummer, Verkehrsmittel und Status']},
 {v:'0.90_05',d:'26.11.2026',items:['KI: Aufgaben-Karussell steht immer oben, direkt unter dem Fragefeld und über dem Gespräch']},
 {v:'0.90_04',d:'26.11.2026',items:['Bewertung steht in den Listen hinter Land und Flagge','Einmalig alle Bewertungen aktualisieren (Orte und Unterkünfte, über Claude) – läuft nach dem Update automatisch an, mit Fortschritt und Stopp; später erneut unter Einstellungen']},
 {v:'0.90_03',d:'26.11.2026',items:['Google-Bewertungen automatisch über Claude: bei Suchtreffern, beim Hinzufügen von Orten, Ausflügen (auch aus KI-Vorschlägen und Buchungen) und bei neuen Unterkünften','Bewertung je Ort und je Unterkunft auf Knopfdruck neu holen; Quelle wird angezeigt','Karte: Bewertungen einblendbar und Mindestbewertung (ab 4,0 oder 4,5) für Ausflüge und Ideen','Einstellung „Bewertungen automatisch“ zum Abschalten']},
 {v:'0.90_02',d:'26.11.2026',items:['Karte ohne Hinweis „API KEY REQUIRED“: neue Kartenkacheln ohne Schlüssel (Schlicht hell/dunkel, Straßen, Satellit)','Karte im Vollbild mit Länderauswahl; Zurück schließt das Vollbild','Filter für die Karte: Unterkünfte, Transfers, Ausflüge, Ideen und Kartenstil','Plus-Knopf liegt immer über der Karte','Karte zoomt zuverlässiger auf das gewählte Land']},
 {v:'0.90_01',d:'26.11.2026',items:['Neue Arbeitsversion auf Basis der Vollversion 0.90 (inhaltlich identisch)']},
 {v:'0.90',d:'26.11.2026',items:['Neue App mit klarem Aufbau: Übersicht, Route, KI, Orte und Geld','Etappen-Assistent mit fünf Schritten je Etappe; „Als Nächstes“ und offene Punkte auf der Übersicht','Etappen, Transfers, Unterkunft, Ausflüge, Ausgaben und Budget direkt bearbeiten – mit Ziehen, Wischen, Menü und Rückgängig','KI-Zentrale: Fragen mit Übernehmen, Reise prüfen, Richtpreise, Bewertungen, Tagesplan, Einreise; Buchung einlesen und Beleg lesen','Checklisten für Einreise und Vorbereitung je Land','Karte mit Etappen, Unterkünften, Transfers und Ausflügen','Zurück-Taste geht immer genau eine Ebene zurück','Darstellung hell, dunkel oder automatisch','Gleiche Reisedaten wie bisher, Tagessicherung vor der ersten Änderung eines Tages; die vorherige App 0.81 bleibt unter Einstellungen erreichbar']}];
function ic(n,s=18,a,b){const c=typeof a==='string'?a:'currentColor';const w=typeof a==='number'?a:(typeof b==='number'?b:1.9);return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="flex:none;display:block">${IC[n]||''}</svg>`}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtDY=d=>fmtD(d)+d.getFullYear();
const dl=d=>WD[d.getDay()]+' '+fmtD(d);
const pd=s=>new Date(s+'T12:00:00');
const UI={tab:'home',stack:[],preview:null,view:'liste',q:'',of:'alle',focus:null,cur:null,amt:'100000',dir:1,kiScope:'all',pages:[],aiScope:null,later:[],res:null,raw:null};
try{UI.later=JSON.parse(localStorage.getItem('auszeit27_v2later')||'[]')}catch(e){}
const saveLater=()=>{try{localStorage.setItem('auszeit27_v2later',JSON.stringify(UI.later.slice(-200)))}catch(e){}};

// ---------- Speichern mit Tagessicherung, Abgleich mit der heutigen App ----------
const BAK='auszeit2027_bak_v2';
function backupToday(){try{const t=iso(new Date());const b=JSON.parse(localStorage.getItem(BAK)||'null');if(b&&b.day===t)return;const raw=localStorage.getItem(STORE);if(!raw)return;localStorage.setItem(BAK,JSON.stringify({day:t,ts:Date.now(),raw}))}catch(e){UI.bakErr=e.message}}
function backupInfo(){try{const b=JSON.parse(localStorage.getItem(BAK)||'null');return b&&b.raw?b:null}catch(e){return null}}
save=function(){EXC_CACHE=null;if(S&&S.places)ensurePids();const raw=JSON.stringify(S);backupToday();
 try{localStorage.setItem(STORE,raw)}catch(e){try{localStorage.removeItem(BAK);localStorage.setItem(STORE,raw);UI.bakErr='Kein Platz für die Tagessicherung'}catch(e2){toast('Speichern fehlgeschlagen: '+esc(e2.message),8000);return}}UI.raw=raw};
function syncIn(){try{const r=localStorage.getItem(STORE);if(r&&UI.raw&&r!==UI.raw){UI.raw=r;load();render();toast('Änderungen aus der heutigen App übernommen.')}}catch(e){}}
window.addEventListener('storage',e=>{if(e.key===STORE)syncIn()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncIn()});

// ---------- Darstellung ----------
function themePref(){try{return localStorage.getItem('auszeit27_v2theme')||'auto'}catch(e){return 'auto'}}
function isDark(){const t=themePref();return t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function applyTheme(){document.documentElement.classList.toggle('dark',isDark());document.querySelectorAll('meta[name=theme-color]').forEach(x=>x.setAttribute('content',isDark()?'#121314':'#F6F5F1'))}

// ---------- Grundfunktionen der Oberfläche ----------
function ready(){return !!(S&&Array.isArray(S.stages)&&S.stages.length)}
const flag=id=>/^[A-Z]{2}$/.test(id||'')?String.fromCodePoint(...[...id].map(ch=>127397+ch.charCodeAt(0))):'';
const cname=id=>`${flag(id)?`<span class="fl">${flag(id)}</span>`:''}${esc(country(id).name)}`;
const totalN=()=>totalNights();
const pname=st=>byId(st?.placeId)?.name||'';
const nN=n=>n+' '+(n===1?'Nacht':'Nächte');
function today(){return UI.preview?pd(UI.preview):nowD()}
function stageAt(dIso){return stagesDated().find(x=>!x.gap&&iso(x.from)<=dIso&&dIso<iso(x.to))}
const exOf=i=>excursionsSt(i).map(o=>o.p);
const curList=c=>{const l=tripCurs();if(c&&!l.includes(c))l.unshift(c);return l};
const cost$=o=>{const v=eurOf(o);if(v==null)return null;return o.cur&&o.cur!=='EUR'?`${fmtCur(numOf(o.cost),o.cur)} · ${eur(v)}`:eur(v)};
// Status je Etappe: fünf Schritte
function legDone(l){return l.status==='gebucht'}
function steps(i){const d=stagesDated()[i];const st=S.stages[i];const L=legsOf(st);const ex=exOf(i);const days=[];for(let k=1;k<d.nights;k++)days.push(iso(addDays(d.from,k)));
 const free=days.filter(x=>!ex.some(e=>e.planned===x));
 const miss=[];if(d.nights&&st.stay&&st.stay.status==='gebucht'&&eurOf(st.stay)==null)miss.push('Unterkunft');L.forEach((l,j)=>{if(l.status==='gebucht'&&eurOf(l)==null)miss.push(trLabel(st,j)||'Transport')});ex.forEach(x=>{if(x.tt&&x.tt.status==='gebucht'&&eurOf(x.tt)==null)miss.push(x.name)});
 return [

// Bei Suche, beim Hinzufügen und auf Wunsch: Claude sucht die Google-Maps-Bewertung (Sterne und Anzahl).
const AI_RT_SYS=`Du ermittelst Google-Maps-Bewertungen (Sterne 1–5 und Anzahl der Rezensionen) für Orte, Sehenswürdigkeiten, Restaurants und Unterkünfte in Asien. Nutze die Websuche.
Antworte NUR mit JSON ohne Kommentare: {"items":[{"i":0,"rating":4.6,"count":812,"src":"Google Maps"}]}
Vorgehen: Suche je Ort gezielt nach der Google-Maps-Bewertung, z. B. „<Name> <Ort> Google Bewertungen“ oder „<Name> <Ort> Google reviews“. Google-Sterne stehen in Suchergebnissen von Google Maps und auf Seiten, die ausdrücklich Google-Bewertungen zeigen (z. B. Wanderlog, Mindtrip) – src dann "Google Maps".
Regeln: Nur Werte, die in den Suchergebnissen stehen – nichts schätzen oder erfinden. Google Maps hat immer Vorrang; Tripadvisor (src "Tripadvisor") nur, wenn nirgends eine Google-Bewertung zu finden ist. Bewertungen auf einer 10er-Skala (z. B. Booking.com) nicht verwenden. Nicht gefunden oder unsicher, ob es derselbe Ort ist: rating null. count als ganze Zahl oder null.`;

const PAX=2;
const AI_CONN_SYS=`Du planst Transfers in Süd- und Südostasien für eine Reise-App (zwei Reisende mit Gepäck) und vergleichst ALLE sinnvollen Verbindungen einer Strecke.
Vorgehen: Rufe die angegebene 12Go-Seite ab bzw. nutze die Websuche (12go.asia, Bookaway, Rome2Rio, Bahn- und Busfahrpläne; für Flüge Skyscanner-Routenseiten wie skyscanner.de/routes/fra/han/…, Google Flights und Fluggesellschaften). Prüfe jedes Verkehrsmittel: Privatfahrer/Taxi, Linien- und Schlafbus/Limousine, Zug, Flug (inklusive Wege zu und von den Flughäfen), Boot – und sinnvolle Kombinationen mit Umstieg.
Antworte am Ende NUR mit JSON ohne Kommentare:
{"options":[{"title":"kurzer Name, z. B. Schlafbus direkt","mode":"car|bus|train|boat|flight","dur_h":ZAHL,"dur":"z. B. 14–15 Std.","dep":"HH:MM oder null","ops":"Anbieter kurz","note":"1 Satz: Abholung, Gepäck, Besonderheiten","segments":[{"mode":"car|bus|train|boat|flight","from":"Ort","to":"Ort","dur":"z. B. 1,5 Std.","dep":"HH:MM oder null","ops":"Anbieter oder null","from_iata":"bei Flug: IATA-Code des Abflughafens, sonst null","to_iata":"bei Flug: IATA-Code des Zielflughafens, sonst null","offers":[{"op":"Anbieter","cls":"Klasse oder Fahrzeug wie angezeigt, z. B. SUV 4pax, Sleeper, Economy","seats":ZAHL oder null,"price":ZAHL,"cur":"Währung wie angezeigt","dep":"HH:MM oder null","rating":ZAHL oder null}],"price_min":ZAHL,"price_max":ZAHL,"cur":"Währung des Preises, z. B. EUR, USD, VND","per":"person" oder "vehicle","vehicle":"nur bei vehicle: z. B. Limousine 4 Sitze","psrc":"Herkunft des Preises kurz, z. B. 12go, Bookaway, Hotel-Transfer, Schätzung"}]}],"why":{"fastest":"1 Satz","cheapest":"1 Satz","balanced":"1 Satz"},"chg":"nur bei deutlicher Abweichung von der früheren Recherche: 1 Satz mit Grund, sonst null","src":"12go.asia" oder "Websuche" oder "Schätzung"}
Preisregeln (wichtig, damit Preise bei jeder Suche gleich bleiben):
- Echte Preise haben Vorrang: zuerst die 12Go-Fahrplantabelle, dann gezielte Websuche je Verkehrsmittel (Bookaway, Baolau, Betreiber- und Bahnseiten, Skyscanner-Routenseiten, Google Flights, Fluggesellschaften). Ist eine Seite nicht lesbar, eine andere Quelle versuchen. Geschätzt wird nur, wenn keine Quelle einen Preis zeigt.
- offers: bis zu 6 konkrete Angebote je Segment, die du auf einer abgerufenen Seite oder in Suchergebnissen gesehen hast (z. B. Zeilen der 12Go-Fahrplantabelle), genau abgeschrieben – Preis und Währung wie angezeigt, die günstigsten passenden zuerst. Bei Privatfahrern nur Fahrzeuge mit mindestens 3 Plätzen. Bei Flügen nur Preise für die einfache Strecke (nicht Hin- und Rückflug), Economy, pro Person. NUR echte Angebote: Fehlen sie, offers leer lassen und price_min/price_max als Schätzung mit psrc "Schätzung" angeben.
- Preise je Segment so, wie die Quelle sie nennt: Betrag in der Währung der Quelle, einfache Fahrt, ohne Trinkgeld. Keine Gesamtpreise – die App rechnet selbst für zwei Personen.
- per "vehicle" = Preis für das ganze Fahrzeug, NICHT mit der Personenzahl multiplizieren. per "person" = Preis für eine Person.
- Privatfahrer, Taxi, Grab und privater Transfer sind mode "car" mit per "vehicle". Rechne mit dem kleinsten passenden Fahrzeug für zwei Personen mit Gepäck (Limousine oder SUV, 4–5 Sitze) und direkter Fahrt ohne Sightseeing-Stopps. Bei mehreren Angeboten die übliche Spanne gängiger Anbieter, nicht das teuerste oder billigste Einzelangebot.
- Linien-, Limousinen- und Schlafbusse, Sammeltaxis und Shared Vans sind mode "bus" mit per "person". Bus und Zug in der Klasse, die Reisende üblich buchen (z. B. Schlafbus, Soft Sleeper); andere Klassen als eigene Option. Flug: Economy mit Freigepäck.
- Jedes Segment bekommt einen Preis; kurze Taxi-Zubringer notfalls geschätzt (psrc "Schätzung").
- Nennt der Auftrag eine frühere Recherche, ist sie der Ausgangswert: Behalte ihre Preise, wenn deine Quellen sie bestätigen oder nichts Belastbares zeigen. Weiche nur mit konkreter Quelle um mehr als 25 % ab und nenne den Grund in "chg". Angebote (offers) aber immer genau so abschreiben, wie sie in der Quelle stehen.
Weitere Regeln: 2–5 Optionen, die es auf dieser Strecke wirklich gibt, verschiedene Verkehrsmittel abdecken. dur_h = Gesamtdauer in Stunden (Zahl) inklusive Umstiegen. segments in Reihenfolge, ein Segment je Verkehrsmittelwechsel (z. B. Taxi zum Bahnhof, Zug, Taxi zur Unterkunft); eine direkte Verbindung hat genau ein Segment. src = "Schätzung", wenn keine aktuellen Angebote gefunden wurden. Nichts erfinden.`;

Echte Preise haben Vorrang (wichtig): Ermittle für JEDEN Vorschlag einen echten Preis pro Nacht. Reihenfolge: 1) Preis für genau die Reisedaten auf einer abgerufenen Portalseite (dated true). 2) Echter Preis ohne Datum – „ab“-Preis oder Durchschnittspreis aus Suchergebnissen oder Seiten von Booking, Agoda, Trip.com, Expedia, Hotels.com, Kayak oder Tripadvisor (dated false). 3) Erst wenn für dieses Haus keine Quelle einen Preis zeigt: Schätzung aus echten Preisen vergleichbarer Häuser der Gegend in price_min/price_max mit psrc "Schätzung". Ist eine Seite gesperrt oder ohne Preise (z. B. JavaScript-Prüfung der Booking-Suche), suche gezielt mit dem genauen Hotelnamen und „Preis pro Nacht“ bzw. „price per night“ oder rufe die Hotelseite bei Agoda, Trip.com oder Kayak ab, bevor du schätzt. Bei gleich guter Eignung Häuser mit echtem Preis vorziehen. Nie ohne Preis antworten. Gib für jedes Haus die Tripadvisor-Adresse an (ta), wenn sie in den Suchergebnissen auftaucht – die App lädt damit Preise für die Reisedaten nach.

function hmTargets(){const T=today();const ds=stagesDated();const out=[];const seen=new Set();
 const push=o=>{if(!okLL(o.ll))return;const key=o.k+':'+JSON.stringify(o.ref);if(seen.has(key))return;seen.add(key);out.push(o)};
 for(let dd=0;dd<=2;dd++){const t=iso(addDays(T,dd));

  const s=stageAt(t);if(s&&s.nights){const st=S.stages[s.i];const ll=stageLL(s.i);const nm=st.stay&&st.stay.name?st.stay.name:pname(st);if(dd===0||(iso(s.from)===t&&!out.some(x=>(x.k==='stay'||x.k==='stage')&&x.ref===s.i)))push({k:st.stay&&st.stay.name?'stay':'stage',ref:s.i,ll,day:dd,lab:nm})}
  // Transfers des Tages: Ziel der Strecke (entfällt, wenn das Ziel schon als Unterkunft/Etappe markiert ist)
  ds.forEach(d=>{if(d.gap)return;const st=S.stages[d.i];const LG=legsOf(st);LG.forEach((l,j)=>{const ld=l.date||iso(d.from);if(ld!==t)return;const I=trInfo(d,null,j);const last=j===LG.length-1;const ll=l.toLL?[l.toLL.lat,l.toLL.lon]:last?stageLL(d.i):null;
   if(last&&!l.toLL&&out.some(x=>(x.k==='stay'||x.k==='stage')&&x.ref===d.i))return;push({k:'leg',ref:[d.i,j],ll,day:dd,time:l.dep||'',lab:'→ '+I.to})})});
  // Ausflüge des Tages
  S.places.filter(p=>p.planned===t&&p.role!=='anchor'&&p.lat!=null).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99')).forEach(p=>push({k:exStageIdx(p)>=0?'ex':'idea',ref:p.id,ll:[p.lat,p.lon],day:dd,time:p.time||'',lab:p.name}))}

function aiTaskOf(o){if(o&&o.task)return o.task;const s=String((o&&o.system)||'');const f=AI_TASKS.find(([p])=>s.startsWith(p));return f?f[1]:'std'}
function aiEffort(o,M){if(o&&o.effort===false)return null;if(o&&o.effort)return o.effort;const k=Object.keys(AI_MODELS).find(x=>AI_MODELS[x]===M)||'haiku';return (AI_EFF[aiTaskOf(o)]||AI_EFF.std)[k]||'medium'}

// ---------- Preise für eure Daten über Tripadvisor (Xotelo, kostenlos, ohne Konto) ----------
// Nach jeder Unterkunftssuche lädt die App für jedes Haus die Preise der Portale für genau eure Daten (2 Erwachsene, 1 Zimmer, EUR).
const XO_API='https://data.xotelo.com/api',XO_K='auszeit27_xo';
const XO_SRC=[[/booking/i,'Booking'],[/agoda/i,'Agoda'],[/expedia/i,'Expedia'],[/hotels\.?com/i,'Hotels.com'],[/trip\.?com|ctrip/i,'Trip.com'],[/priceline/i,'Priceline'],[/vio|findhotel/i,'Vio.com'],[/zenhotels/i,'ZenHotels'],[/trivago/i,'Trivago'],[/traveloka/i,'Traveloka']];
const xoKeyOf=s=>{const m=/(g\d+-d\d+)/.exec(String(s||''));return m?m[1]:''};
function xoState(){try{return JSON.parse(localStorage.getItem(XO_K)||'{}')}catch(e){return {}}}
function xoStateSet(o){try{localStorage.setItem(XO_K,JSON.stringify(Object.assign(xoState(),o)))}catch(e){}}
async function xoGet(path){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),15000);
 try{const r=await fetch(XO_API+path,{signal:ac.signal});let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error((j&&j.error&&(j.error.message||j.error))||('HTTP '+r.status)),{http:r.status});
  if(j&&j.error)throw new Error(typeof j.error==='string'?j.error:(j.error.message||'Fehler'));return j}
 catch(e){if(e.name==='AbortError')e.message='Zeitüberschreitung';else if(e.name==='TypeError'||/Failed to fetch|NetworkError|Load failed/i.test(e.message||'')){e.net=true;e.message='nicht erreichbar (vom Browser blockiert oder offline)'}throw e}
 finally{clearTimeout(t)}}
const XO_LIST=new Map();
async function xoFind(o,place,locs){if(o.taKey)return o.taKey;
 // 1) Suche nach Name und Ort
 try{const j=await xoGet('/search?query='+encodeURIComponent(o.name+' '+place)+'&location_type=accommodation');const L=(j&&j.result&&j.result.list)||[];
  const b=L.map(x=>({x,s:piSim(o.name,x.name)})).sort((a,b)=>b.s-a.s)[0];if(b&&b.s>=0.5)return b.x.hotel_key||xoKeyOf(b.x.url)}catch(e){if(e.net)throw e}
 // 2) Hotelliste des Orts (Ortskennung aus anderen Häusern derselben Suche)
 for(const lk of locs){try{if(!XO_LIST.has(lk)){const j=await xoGet(`/list?location_key=${lk}&limit=100&sort=best_value`);XO_LIST.set(lk,(j&&j.result&&j.result.list)||[])}
  const b=XO_LIST.get(lk).map(x=>({x,s:piSim(o.name,x.name)})).sort((a,b)=>b.s-a.s)[0];if(b&&b.s>=0.6)return b.x.key}catch(e){if(e.net)throw e}}
 return ''}
async function xoRates(key,st){const [a,b]=hDates(st);const j=await xoGet(`/rates?hotel_key=${encodeURIComponent(key)}&chk_in=${a}&chk_out=${b}&adults=2&rooms=1&currency=EUR`);
 const R=(j&&j.result&&j.result.rates)||(j&&j.rates)||[];
 return R.filter(r=>r&&+r.rate>0).map(r=>{const nm=String(r.name||r.code||'');const f=XO_SRC.find(([re])=>re.test(nm));return {src:f?f[1]:nm.replace(/\.com$/i,'').slice(0,14),min:+r.rate,cur:'EUR',dated:true,via:'Tripadvisor'}})}
async function xoFill(i,only){const st=S.stages[i];const R=st&&st.hsug;if(!R||!R.opts)return;const place=(byId(st.placeId)||{}).name||pname(st);const cn=country(st.country).name;
 const todo=R.opts.map((o,k)=>({o,k})).filter(x=>only==null||x.k===only);if(!todo.length)return;
 R.xo=Object.assign({},R.xo||{},{run:1});hotRefresh();let net=null;
 const locs=()=>[...new Set(R.opts.map(o=>xoKeyOf(o.taKey).split('-')[0]).filter(Boolean))];
 for(const {o} of todo){try{const key=await xoFind(o,place+', '+cn,locs());if(!key){o.xo={ts:Date.now(),miss:1};continue}o.taKey=key;
   const P=hPrices(await xoRates(key,st));o.xo={ts:Date.now(),n:P.length};
   if(P.length){const keep=(o.prices||[]).filter(p=>!(p.dated&&p.via==='Tripadvisor')&&!(!p.dated&&P.some(q=>q.src===p.src)));o.prices=[...P,...keep];hotPrice(o);delete o.appEst}}
  catch(e){if(e.net){net=e;break}o.xo={ts:Date.now(),err:String(e.message||e).slice(0,80)}}}
 R.xo={run:0,ts:Date.now(),n:R.opts.length,found:R.opts.filter(o=>o.xo&&o.xo.n).length,net:net?1:0,err:net?String(net.message||''):''};xoStateSet({ok:!net,ts:Date.now(),err:net?net.message:''});save();hotRefresh()}

 if(X.run)return `<div class="small" style="margin:-4px 2px 10px;color:var(--ki);display:flex;gap:6px;align-items:center"><span class="spin"></span>Preise für eure Daten werden über Tripadvisor geladen …</div>`;
 if(X.net)return `<div class="small" style="margin:-4px 2px 10px;line-height:1.45;color:var(--warn)">Tripadvisor-Preise (Xotelo): ${esc(X.err||'nicht erreichbar')}. <button class="small" style="color:var(--ki);font-weight:600" data-a="xoRun">Erneut versuchen</button></div>`;

{const r0=hotRun;hotRun=async function(i){const st=S.stages[i];const before=st&&st.hsug&&st.hsug.ts;await r0.apply(this,arguments);const R=st&&st.hsug;if(R&&R.ts!==before)xoFill(i)}}

 if(o&&!o.dated){UI.hoChk=st.id+':'+k;UI.hoChkT0=Date.now();hotRefresh();busyTick();try{await xoFill(i,k)}catch(e){}UI.hoChk=null;

 return h0.apply(this,arguments)}}
