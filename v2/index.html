html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Roboto,sans-serif;font-size:13px;line-height:1.38;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
.proto{display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 20px 6px;font-size:11.5px;color:var(--ink3)}

main{padding:4px 20px 24px;max-width:560px;margin:0 auto}

.btn.k{color:var(--ki)}
.ki{display:inline-flex;align-items:center;gap:4px;color:var(--ki);font-size:11.5px;font-weight:600;background:var(--kis);border-radius:8px;padding:2px 7px 2px 5px;white-space:nowrap}
